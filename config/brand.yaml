brand:
  page_name: "Alaska.Ai"
  channel: "LinkedIn"
  audience: >
    Alaskans who follow policy, infrastructure, and tech: legislators,
    staffers, utility execs, journalists, university researchers, tribal
    corporation staff, AK-based founders, engaged civic professionals.
    Sophisticated but busy. Not Bay Area tech press. On LinkedIn they also
    include Outside decision-makers who touch Alaska: federal program
    officers, defense contractors, energy and fisheries executives.

  voice:
    one_line: >
      Analytical, policy-aware, takes positions. Names structural problems
      and counter-framings. Like a state-legislature analyst writing for a
      smart, busy Alaskan reader.
    tone_words: [analytical, opinionated, specific, structural, contrarian-when-warranted, plainspoken, fair]
    register: "Essayistic, not chatty. Someone who read the briefing book and is willing to disagree with it."
    do:
      - "Take a position. Don't hedge into mush."
      - "Frame issues structurally. Name the binary, the false dichotomy, the missing option."
      - "Name specific entities, numbers, dates, agencies, bases, regions, dollar amounts."
      - "End the post with a real, debatable question to readers."
      - "Plain English. Complex ideas in simple sentences. Grade 8-10 reading level."
      - "Never use em dashes or en dashes, ever, in post copy OR on-slide text. Write ranges as 'X to Y'. Straight quotes only."
      - "NEVER use a colon, ever, in post copy or on-slide text (maintainer rule, 2026-07-21). For a pause use a comma, a period, or parentheses. Restructure the sentence instead of reaching for a colon. Clock times like 4:30 are the only exception."
      - "Cite the source of a claim inline when it matters ('per the RCA filing', 'NOAA data show')."
      - "NEVER write 'cannot'. Always write \"can't\" (maintainer rule, 2026-07-30). 'Cannot' is press-release register; this page sounds like an analyst talking to a busy Alaskan. Enforced by scripts/caption_check.py."
      - "DATES ARE MONTH FIRST (maintainer rule, 2026-08-05). Write 'August 10th', never '10 August'. Use the ordinal when no year follows; with a year use the plain form, 'August 27, 2026', which is what the source documents print. Enforced by scripts/caption_check.py."
      - "SPEND FEWER COMMAS (maintainer rule, 2026-08-05). Budget is 1.05 commas per 100 characters of caption body, hashtags excluded. That is 10 percent below the 1.17 mean measured across the first 26 shipped captions. When you are over, cut a comma or split the sentence; do not swap in a semicolon, which is already banned. Enforced by scripts/caption_check.py."
    dont:
      - "Don't sign off with 'Follow Alaska.Ai'. The close slide's single ask handles it."
      - "Don't open with 'Imagine...', 'In an era where...', or 'It's no secret that...'"
      - "Don't use 'game-changer', 'revolutionize', 'disrupt', 'synergy', or 'leverage' (as a verb)."
      - "Don't use emojis. Anywhere. Slides or copy."
      - "NO FIRST PERSON IN THE CAPTION, EVER (maintainer rule, 2026-08-05). No I, we, us, our, my or me outside a straight-quoted source. The page describes the world; it never narrates its own work. This also bans the pronoun-free version of the same posture, 'no page anyone could reach', 'Enclosed,', 'what the search turned up'. Say what is true of the record instead. Enforced by scripts/caption_check.py."
      - "Don't write 'we' or 'us' implying speaking for Alaskans. Speak about Alaska, not as Alaska."
      - "NEVER OPEN A SENTENCE WITH 'And' OR 'But' (maintainer rule, 2026-08-05). They join clauses. A sentence starting on one is a fragment wearing a full stop. Join it to the sentence before with a comma, or drop the word. Enforced by scripts/caption_check.py."
      - "Don't invent quotes, numbers, or people. If it isn't in claims.json, it doesn't exist."
  date_format:
    # OWNER RULE 2026-08-05: "rn ur saying '10 August', the normal way to say it is August 10th."
    # The live instance was runs/2026-08-04/caption.txt, "Comments close 28 August at 5:00 p.m."
    # Ten of the captions shipped before this rule carried a wrong form, so it is a habit, not a slip.
    rule: "In any sentence a human READS OR HEARS, write the month name first and the day as an ordinal. August 10th. Never '10 August', never a bare 'August 10', never 'the 10th of August', never an abbreviated month in prose."
    good: ["August 10th", "Comments close August 28th", "August 2026 (no day, so no ordinal)"]
    bad: ["10 August", "August 10", "Aug 10", "the 10th of August", "10th August"]
    applies_to: "the LinkedIn caption, slide copy that is a SENTENCE, and the Gmail draft's prose."
    iso_is_still_correct_for: "filenames, ledger and JSON fields, and a PROVENANCE STAMP in a source list, where the date is a citation rather than a sentence. Read it aloud: if it sounds like a person talking, it takes the ordinal."
    enforced_by: "scripts/caption_check.py DATE_FORMS (hard fail)."

  comma_discipline:
    # OWNER RULE 2026-08-05: "reduce comma usage by 10% on the captions moving forward."
    rule: "Captions carry FEWER commas. The ceiling is 6.2 commas per 100 words of caption body."
    measured_baseline: "22 shipped captions as of 2026-08-05, mean 6.88 commas per 100 words, median 6.52. Ten percent below the mean is 6.20."
    why_not_the_weekly_repos_number: "alaska-ai-weekly sets 4.9 because its own shipped mean was 5.41. Carousel captions are shorter and comma-heavier, so importing 4.9 here would be a 29 percent cut rather than the 10 percent the owner asked for. The RULE is ten percent below what THIS surface actually ships."
    how_to_cut_them: "Do NOT just delete commas and leave a run-on, which trades a comma for a worse sentence. Split the sentence at the comma and let it be two sentences. Cut the introductory clause that only existed to be qualified. Drop the appositive restating a noun the reader already has."
    enforced_by: "scripts/caption_check.py COMMA_PER_100W (hard fail)."

  contractions:
    # OWNER RULE 2026-08-06.
    rule: "Write \"can't\", never \"cannot\"."
    why: "The voice speaks it that way. \"cannot\" reads written rather than said."
    enforced_by: "scripts/caption_check.py CANNOT_RE (hard fail). Exempt inside a straight-quoted verbatim passage, because a source is allowed to write however it wrote."

  sentence_openers:
    # OWNER RULE 2026-08-06.
    rule: "Never open a sentence with \"And\" or \"But\"."
    why: "A sentence that opens on a conjunction is leaning on the one before it. Join the two, or cut the conjunction and let the sentence stand on its own."
    enforced_by: "scripts/caption_check.py OPENER_RE (hard fail). Matched at the top of the text, after terminal punctuation, and at the head of a line. Same verbatim-quote exemption."

  banned_phrases:
    - "game-changer"
    - "revolutionize"
    - "disrupt"
    - "synergy"
    - "leverage"
    - "buckle up"
    - "let's dive in"
    - "in a world where"
    - "imagine if"
    - "it's no secret that"
    - "here is the honest part"
    - "here's the honest part"
    - "here's what matters"
    - "here is what matters"
    - "here's the part that matters"
    - "at its core"
    - "demystify"
    - "furthermore"
    - "moreover"
    - "additionally"
    - "in conclusion"
    - "transformative"
    - "myriad"
    - "plethora"
    - "pivotal"
    - "unwavering"
    - "multifaceted"
    - "journey"
    - "symphony"
    - "here's the thing"
    - "the truth is"
    - "make no mistake"
    - "let's be clear"
    - "to be clear"
    - "that said"
    - "worth noting"
    - "underscore"
    - "shed light"
    - "pave the way"
    - "double-edged"
    - "the intersection of"
    - "isn't just"
    - "deep dive"
    - "key takeaway"
    - "actionable"
    - "first and foremost"
    - "when it comes to"
    - "in terms of"
    - "boasts"
    - "streamline"
    - "empower"
    - "harness"
    - "meticulous"
    - "vibrant"
    - "stands as"
    - "serves as"
    - "plays a crucial"
    - "at the heart of"
    - "a stark reminder"
    - "speaks volumes"
    - "here is the part that matters"
    - "here's where the frame breaks"
    - "here is where the frame breaks"
    - "delve"
    - "tapestry"
    - "testament to"
    - "ever-evolving"
    - "navigating the"
    - "unlock"
    - "unleash"
    - "cutting-edge"
    - "seamless"
    - "supercharge"
    - "skyrocket"

  linkedin_post:
    caption_chars: [300, 900]        # hard band; sweet spot 400-700
    hook_max_chars: 140              # must be complete before the mobile fold
    hashtags_exactly: 3              # niche > broad, at the very end
    links_in_body: false             # sources go in first comment
    ends_with: engagement_question
    deck_summary_line: true          # 1-2 plain lines describing the deck (accessibility + ranker)
    comma_per_100_chars: 1.05        # budget, hashtags excluded; 10% under the 26-caption mean of 1.17
    date_form: month_first_ordinal   # "August 10th"; with a year, "August 27, 2026"

visual:
  # The constellation system: FIXED marks every deck, everything else rotates.
  constellation:
    wordmark: "ALASKA.AI"                    # set in the deck's display face
    site: "alaskaaihq.com"                   # ALWAYS on the close slide, small, mono face, near the mark
    polaris_star: true                       # the 4-point gold star glyph appears once per deck minimum
    progress_counter: "NN / NN in JetBrains Mono"
    coordinates_footer: "location-relevant, e.g. 61°13'N · 149°54'W (mark data-decorative)"
    gold_presence: "#FFC72C appears deliberately on every slide, budgeted in the dossier"
    base_register: "dark arctic (#030710..#0d2038 family) as the default; a light deck is allowed as a deliberate variance-dial-5 move, max once per 8 runs"
  tokens:
    flag_gold: "#FFC72C"
    gold_halo: "#FFDA6E"
    deep_night: "#02060F"
    flag_blue_horizon: "#081426"
    panel_navy: "#0E2138"
    aurora_green: "#3CE6B4"
    aurora_ice: "#5AC8F0"
    aurora_violet: "#9664E6"
    forget_me_not: "#6EA5FF"
    snow: "#F4F8FF"
    supporting_palettes_rotate: "from the story's material world; see DESIGN_DOCTRINE §3"
  on_slide_text_rules:
    - "No em dashes or en dashes in ANY on-slide string. Zero exceptions."
    - "No colons in any on-slide string (clock times excepted). Restructure instead."
    - "Straight quotes. Tabular numerals for data. Units spaced (43 MW, not 43MW)."
    - "No emojis, no hashtags on slides."
    - "Never 'cannot' on a slide either. Write \"can't\" (maintainer rule, 2026-07-30)."
    - "Dates are month first on slides too. 'AUGUST 27TH' or 'AUGUST 27, 2026', never '27 AUGUST' (maintainer rule, 2026-08-05)."
    - "No first person on a slide either. Slide 08 of No.26 shipped 'not on any page we could reach' and that is the drift this rule exists to stop (maintainer rule, 2026-08-05)."
    - "No slide string opens with 'And' or 'But' (maintainer rule, 2026-08-05)."
    - "Every factual on-slide number/claim carries a claim-id in the dossier."
