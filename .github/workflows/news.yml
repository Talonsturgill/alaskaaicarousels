name: Alaska headlines

on:
  schedule:
    - cron: "23 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-headline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check selection and publication rules
        run: |
          python3 scripts/news_headlines.py --self-test
          python3 scripts/news_publish.py --self-test
      - name: Restore the last published observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/news_publish.py --restore
      - name: Collect and validate the latest headlines
        id: collect
        run: |
          python3 scripts/news_headlines.py --collect
          python3 scripts/news_headlines.py --check
          python3 scripts/news_headlines.py --health
          python3 -c 'import json, os; print("checked_at=" + json.load(open("ledger/news/latest.json"))["checked_at"], file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      # Only news-data/ledger/news/latest.json moves. Unrelated site CI cannot prevent this refresh.
      - name: Publish validated headline data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/news_publish.py --publish
      - name: Verify public data and homepage integration
        env:
          NEWS_CHECKED_AT: ${{ steps.collect.outputs.checked_at }}
        run: python3 scripts/news_headlines.py --live-check --wait-seconds 600 --expected-check "$NEWS_CHECKED_AT"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-1.56.1
      - name: Install the pinned browser runtime
        timeout-minutes: 8
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx --no-install playwright install chromium
          node -e "require('playwright').chromium.launch().then(b=>b.close()).then(
            ()=>console.log('chromium launches'), e=>{console.error(e); process.exit(1)})"
      - name: Verify the headline a reader actually sees
        env:
          NEWS_CHECKED_AT: ${{ steps.collect.outputs.checked_at }}
        run: node tests/news_live.mjs
