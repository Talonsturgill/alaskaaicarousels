name: Publish docket site

on:
  push:
    branches: [main]
    # The workflow file itself is a path worth republishing on. A change to the
    # publisher is a change to what gets published, and without this a fix to
    # this file could only take effect on whatever unrelated push came next.
    paths: ["docs/**", ".github/workflows/pages.yml"]
  # GitHub does not start workflow runs for pushes made with GITHUB_TOKEN, and
  # the gas watch collector pushes its nightly page rebuild with exactly that.
  # So the push trigger above never fired for it and the rebuilt page sat on
  # main undeployed until some unrelated human or app-token push happened to
  # come along. The step that rebuilds it says it is "what makes the published
  # page as live as it claims to be", which was not true. This makes it true.
  workflow_run:
    workflows: ["gas watch"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # workflow_run fires for every gas watch completion, including its
    # pull_request validations and its branch runs. Only a run that finished on
    # main can have changed what main publishes.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request')
    environment:
      name: github-pages
      # Either attempt can be the one that published, so the environment URL has to
      # come from whichever produced it. Reading only the first leaves the deployment
      # showing a blank URL on every run the retry rescued.
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      # 2026-08-06. This step failed four times in one afternoon, with TWO different
      # OIDC faults, and neither is anything about this repository:
      #
      #   Failed to get ID Token. Error Code : 503
      #   upstream connect error or disconnect/reset before headers. reset reason: overflow
      #       -> GitHub's OIDC token service was unavailable. The token never minted.
      #
      #   Invalid actions OIDC token due to No keys from key endpoint match the id token
      #   Failed to create deployment (status: 400)
      #       -> the token minted fine, and the Pages API rejected it because the key it
      #          was signed with was not in the JWKS the API reads. A key rotation that
      #          has not propagated. Nothing in this file can influence it.
      #
      # The action prints `Ensure GITHUB_TOKEN has permission "id-token: write"` for the
      # first one. That is canned advice printed for any token failure and it is
      # misleading here: the permission is granted above and this same config deployed
      # successfully three times that morning. Do not go editing the permissions block.
      #
      # It matters more than a red tick because the failure is SILENT in effect. The
      # build succeeds and uploads a valid artifact, so main is correct and the published
      # site simply keeps serving the previous deploy. On 08-06 that left the videos page
      # showing a superseded caption, and later an eleven-week-stale docket status, with
      # nothing visibly broken.
      #
      # THE FIRST VERSION OF THIS RETRY WAS USELESS AND THE LOGS SHOW EXACTLY WHY. It had
      # no delay, so both attempts ran 1.0s apart (17:35:31.37 and 17:35:32.37) and hit
      # the identical bad key state. Retrying instantly into a propagation fault is not a
      # retry, it is the same request twice. Both faults here are measured in minutes, so
      # the backoff has to be too. Three attempts across roughly five and a half minutes.
      - uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true

      - name: Wait out a token-service blip before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 90
      - uses: actions/deploy-pages@v4
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true

      - name: Wait longer, then make the last attempt the one that decides the job
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 240
      - uses: actions/deploy-pages@v4
        id: deployment_final
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'

      - name: Report which attempt published
        if: always()
        run: |
          if [ "${{ steps.deployment.outcome }}" = "success" ]; then
            echo "deployed on the first attempt"
          elif [ "${{ steps.deployment_retry.outcome }}" = "success" ]; then
            echo "first attempt failed, deployed on the retry 90s later"
          else
            echo "TWO ATTEMPTS FAILED over ~5.5 minutes; the third decided this job."
            echo "If the job is red, main is CORRECT and the published site is STALE."
            echo "Read the OIDC error text before touching anything. A 503 means the"
            echo "token service was down; a 400 'No keys from key endpoint match' means"
            echo "a GitHub key rotation had not propagated. Neither is fixable here, and"
            echo "neither is a permissions problem. Re-run the job once GitHub recovers."
          fi
