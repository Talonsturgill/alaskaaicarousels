name: ask box

# The ask box publishes prose to the public site at read time, which is where
# none of the build-time page lints can reach it. These suites are the only
# thing standing between a guess and a published claim, so they run on every
# change to any part of it.
#
# THREE HALVES, WHICH IS THE POINT. The answer engine assembles sentences in
# the page from ledger fields, and it is the one a reader actually meets. The
# corpus builder and the worker own the two ends of the model lane behind it:
# the builder decides which numbers an answer may contain, the worker refuses
# anything else. A change to one without the other silently loosens the guard,
# so they run together and none of them is optional.
#
# The engine's own suite runs in a real browser because that is where it runs.
# Every catalogued question is asked, and the sentence it returns is checked
# for a count that disagrees with the cards under it, a placeholder that
# leaked, a colon this house does not publish, and any wording that predicts
# an outcome. A record whose value is being right cannot ship a sentence that
# contradicts the page it sits on.

on:
  pull_request:
    paths:
      - "workers/ask/**"
      - "scripts/ask_answers.py"
      - "scripts/ask_corpus.py"
      - "scripts/site_build.py"
      - "scripts/site_signoff.py"
      - "scripts/power_panel.py"
      - "scripts/power_utility.py"
      - "scripts/docket_build.py"
      - "ledger/docket.json"
      - "prompts/ASK_ROUTINE.md"
      - "tests/ask_engine.mjs"
      - "tests/home_ask.mjs"
      - "tests/docket_ask.mjs"
      - ".github/workflows/ask.yml"
  push:
    branches: [main]
    paths:
      - "workers/ask/**"
      - "scripts/ask_answers.py"
      - "scripts/ask_corpus.py"
      - "scripts/site_build.py"
      - "scripts/site_signoff.py"
      - "scripts/power_panel.py"
      - "scripts/power_utility.py"
      - "scripts/docket_build.py"
      - "ledger/docket.json"
      - "tests/ask_engine.mjs"
      - "tests/home_ask.mjs"
      - "tests/docket_ask.mjs"
      - ".github/workflows/ask.yml"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The engine that answers in the page. Entities, handles and facet words
      # are checked against the record they claim to describe, so a rule that
      # has stopped matching anything fails the build instead of quietly
      # returning nothing to a reader.
      - name: The answer engine agrees with the record it reads
        run: |
          python3 scripts/ask_answers.py --self-test
          python3 tests/ask_json_embed.py

      # Builds the corpus from the live ledger and proves the allow-list
      # covers its own source. An allow-list that did not would refuse true
      # answers, which reads to a visitor as the record being wrong.
      - name: The corpus covers what it authorises
        run: python3 scripts/ask_corpus.py --self-test

      # Every control gets a red case. The half that matters most is the set
      # of nine sentences that must NOT trip the no-verdict guard: a guard
      # that blocks its own correct refusal teaches the model to answer
      # instead, which is the exact outcome the rule exists to prevent.
      - name: The answer checks hold, and can still go red
        run: node workers/ask/test.mjs

      # The deep lane runs on text a stranger typed, and delivers back into a
      # page under the site's name. Its authentication and its reuse of the
      # same checks are the whole of its safety, so both are gated.
      - name: The deep lane verifies and authenticates what it publishes
        run: node workers/ask/test-deep.mjs

      # The corpus ships as part of the site, so a builder change that breaks
      # the page build has to fail here rather than at deploy.
      - name: The site still builds with the corpus in it
        run: |
          pip install --quiet Pillow
          python3 scripts/site_build.py --date "$(TZ=America/Anchorage date +%F)" --out /tmp/site
          test -s /tmp/site/ask-corpus.json
          echo "corpus published at $(wc -c < /tmp/site/ask-corpus.json) bytes"

      # The sign-off the routine runs every morning, run here against the site
      # this PR would actually deploy.
      #
      # docs/ AND NOT THE SCRATCH BUILD, because docs/ is what GitHub Pages
      # serves. It also carries the fonts and the og images, which site_build
      # does not emit and which site_fresh_check.py has documented as hand
      # managed for months, so a fresh build directory is missing every asset
      # on the site and signing that off would report a correct build as
      # broken. Pointing at docs/ has the useful side effect that a PR which
      # changes the builder and forgets to rebuild is caught here.
      #
      # Exit 2 is its "needs attention", which is a CI failure even though it
      # is deliberately not one inside a run. A routine must not abort on it. A
      # merge should.
      - name: Every page signs off
        run: |
          python3 scripts/site_signoff.py --self-test
          python3 scripts/site_signoff.py --out docs

      # The engine runs in a browser, so it is tested in one. Every catalogued
      # question is asked for real and the answer is read back out of the DOM.
      - name: Every question the box offers actually answers
        run: |
          bash .github/workflows/browser.sh 1
          SITE=/tmp/site node tests/ask_engine.mjs

      # The front page carries the same lane with none of the engine, so it is
      # its own client and it gets its own browser. The worker is stubbed; the
      # streaming, the thread memory and the guard's wording are not.
      - name: The homepage box holds a conversation
        run: SITE=/tmp/site node tests/home_ask.mjs

      # The engine suite above sends nothing, which is most of what the docket
      # box does and none of what it spends. This is the other half: the two
      # lanes that leave the page, with the worker stubbed both answering and
      # switched off. It also owns the rewrite from the model's closing offer
      # to the reader's own question, which ships inside a button and would
      # otherwise be checked by nobody.
      - name: The docket box's outbound lanes behave
        run: SITE=/tmp/site node tests/docket_ask.mjs
