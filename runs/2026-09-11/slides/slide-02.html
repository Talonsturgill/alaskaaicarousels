<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
html,body{margin:0;padding:0;width:1080px;height:1350px;overflow:hidden;background:#0B1724}
canvas{position:absolute;left:0;top:0;width:1080px;height:1350px}
.wm{position:absolute;left:80px;top:78px;font-family:Archivo,sans-serif;font-variation-settings:"wdth" 100,"wght" 700;font-size:26px;letter-spacing:0.12em;color:#9AA7B0}
.ct{position:absolute;left:760px;top:80px;font-family:"JetBrains Mono",monospace;font-size:24px;letter-spacing:0.10em;color:#7E8C96;font-variant-numeric:tabular-nums lining-nums}
h2{position:absolute;left:80px;top:836px;width:640px;margin:0;font-family:Archivo,sans-serif;font-variation-settings:"wdth" 116,"wght" 640;font-size:66px;line-height:1.02;letter-spacing:-0.018em;color:#F4F8FF}
.bd{position:absolute;left:80px;top:988px;width:680px;margin:0;font-family:Manrope,sans-serif;font-size:32px;line-height:1.34;font-weight:500;color:#C3D4DD}
.big{position:absolute;left:716px;top:300px;font-family:Archivo,sans-serif;font-variation-settings:"wdth" 116,"wght" 700;font-size:112px;line-height:0.9;color:#F4F8FF;font-variant-numeric:tabular-nums lining-nums}
.bigu{position:absolute;left:720px;top:424px;font-family:"JetBrains Mono",monospace;font-size:24px;letter-spacing:0.10em;color:#9AA7B0}
.dot{position:absolute;left:720px;top:494px;width:280px;font-family:"JetBrains Mono",monospace;font-size:24px;line-height:1.45;letter-spacing:0.04em;color:#7E8C96}
.wmk{position:absolute;left:700px;top:1240px;width:300px;text-align:right;font-family:"JetBrains Mono",monospace;font-size:20px;letter-spacing:0.08em;color:#46545F}
.mn{position:absolute;left:80px;top:1170px;width:920px;font-family:"JetBrains Mono",monospace;font-size:24px;letter-spacing:0.06em;color:#9AA7B0}
</style></head>
<body data-contacts='[{"what": "the tariff volume on the margin plane", "shadow": [[836, 734, 26, 10]], "ground": [[761, 734, 26, 10]]}]' data-scale='[{"what":"the Bcf rail","axis":"x","unit":"Bcf","from":[200,0],"to":[1000,13.0],"band":[1230,1258],"marks":[{"at":200,"means":"0 Bcf"},{"at":261,"means":"1 Bcf"},{"at":323,"means":"2 Bcf"},{"at":384,"means":"3 Bcf"},{"at":446,"means":"4 Bcf"},{"at":507,"means":"5 Bcf"},{"at":569,"means":"6 Bcf"},{"at":630,"means":"7 Bcf"},{"at":671,"means":"7.65 Bcf, the measured reading"},{"at":692,"means":"8 Bcf"},{"at":753,"means":"9 Bcf"},{"at":815,"means":"10 Bcf"},{"at":876,"means":"11 Bcf"},{"at":938,"means":"12 Bcf"},{"at":1000,"means":"13.0 Bcf, design volume"}]}]'>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="wm">ALASKA.AI</div>
<div class="ct" data-decorative>02 / 09</div>
<div class="big" data-reserve>58.8</div>
<div class="bigu" data-reserve>PERCENT OF DESIGN</div>
<div class="dot" data-reserve>ONE DOT = 1 MMCF<br>7,648 DOTS DRAWN</div>
<h2 data-reserve>The level is measured<br>every morning.</h2>
<p class="bd" data-reserve>Cook Inlet storage read 7,648,351 Mcf on September 10th. Design volume is not what the field can deliver on any given day.</p>
<div class="wmk" data-decorative>alaskaaihq.com</div>
<div class="mn" data-reserve>WITHDRAWAL 150,000 MCF/D OF 215,000 DESIGN</div>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/akcolor.js"></script>
<script src="@@ASSETS@@/js/aktype.js"></script>
<script src="@@ASSETS@@/js/akstipple.js"></script>
<script src="@@ASSETS@@/js/akparcel.js"></script>
<script src="@@ASSETS@@/js/aksheet.js"></script>
<script src="@@ASSETS@@/js/d3.v7.min.js"></script>
<script src="@@ASSETS@@/js/akgeo.js"></script>
<script src="@@ASSETS@@/js/akpost.js"></script>
<script>
window.renderReady = (async function(){
  await document.fonts.ready;
  AK.fitText(document.querySelector('h2'), {min:46, max:70, maxLines:2});
  const ak = await (await fetch("@@ASSETS@@/geo/alaska-state.geo.json")).json();
  const cv=document.getElementById('art'), cx=cv.getContext('2d');
  cx.scale(2,2);
  const S=AKSHEET,C=S.C,rnd=AK.rng(20260911+2);
  const WIN=[80,200,620,596];
  AKSTIPPLE.reserve('[data-reserve]');
  // margin tone: a vertical fall toward the bottom, with a right-hand shoulder
  // holding the readout column
  S.marginField(cx,{seed:20260911+2,count:21000,
    basins:[[80,828,660,140,1.00],[80,980,700,150,0.96],[706,292,300,320,0.92],[80,1162,600,46,0.90]],
    form:function(x,y){
      const u=x/1080,v=y/1350;
      const fall=0.52*Math.pow(1-v,0.8);
      const shoulder=0.26*Math.exp(-Math.pow(u-0.86,2)/0.05);
      return 0.20+fall*0.7+shoulder+0.09*AK.fbm2(u*3.1,v*2.0,4);
    }});

  // ---- window: the Kenai sheet, with the storage field as 7,648 dots
  AKPARCEL.band(cx,{depth:0.08,sky:"#0B1926",draw:function(bx){
    const w=S.window(bx,WIN);
    w.fillStyle="#7C8378"; w.fillRect(WIN[0],WIN[1],WIN[2],WIN[3]);
    const proj=AKGeo.alaskaProjection(ak,[[0,0],[1080,1350]]);
    AKGeo.zoomTo(proj,ak,[-151.26,60.68],[390,498],9.0);
    proj.clipExtent([[WIN[0],WIN[1]],[WIN[0]+WIN[2],WIN[1]+WIN[3]]]);
    const p=d3.geoPath(proj,w);
    // water first, land over it
    w.fillStyle="#3E525C"; w.fillRect(WIN[0],WIN[1],WIN[2],WIN[3]);
    w.beginPath(); p(ak);
    const lg=w.createLinearGradient(0,WIN[1],0,WIN[1]+WIN[3]);
    lg.addColorStop(0,"#7B8073"); lg.addColorStop(1,"#A3A895");
    w.fillStyle=lg; w.fill();
    w.beginPath(); p(ak); w.strokeStyle="rgba(236,242,238,0.85)"; w.lineWidth=2.0; w.stroke();
    // the CINGSA footprint at FULL DESIGN AREA, bold, and the measured dots inside it
    const cs=proj([-151.26,60.68]);
    const FW=300, FH=210, fx=cs[0]-FW/2, fy=cs[1]-FH/2;
    w.save(); w.beginPath(); w.rect(fx,fy,FW,FH); w.clip();
    AKSTIPPLE.field(w,{seed:20260911+22,count:7648,box:[fx,fy,fx+FW,fy+FH],
      ramp:["#2E4B5E","#3A5F76","#4A7792","#5F93AF","#79AEC8","#9CCADD"],
      radius:function(q){return 0.8+1.5*q;},
      alpha:function(q){return 0.34+0.56*q;},
      height:function(x,y){
        const u=(x-fx)/FW, v=(y-fy)/FH;
        const dome=Math.exp(-(Math.pow(u-0.5,2)/0.20+Math.pow(v-0.52,2)/0.22));
        return Math.max(0,Math.min(1,0.588*dome*(1+0.14*AK.fbm2(u*3,v*3,3))));
      }});
    w.restore();
    w.setLineDash([]); w.strokeStyle="rgba(238,244,240,0.92)"; w.lineWidth=3.5;
    w.strokeRect(fx,fy,FW,FH);
    // dimension call across the outflow throat, fine weight
    const ty=fy+FH+34;
    w.strokeStyle="rgba(226,236,232,0.75)"; w.lineWidth=1.25; w.lineCap="butt";
    w.beginPath(); w.moveTo(fx,ty-8); w.lineTo(fx,ty+8); w.moveTo(fx+FW,ty-8); w.lineTo(fx+FW,ty+8);
    w.moveTo(fx,ty); w.lineTo(fx+FW,ty); w.stroke();
    window.__FX=[fx,fy,FW,FH];
    S.closeWindow(w,WIN);
  }});

  // ---- the declared Bcf rail in the bottom margin
  S.rail(cx,200,1000,1244,26,202);
  const X=(b)=>200+(b/13.0)*800;
  cx.lineCap="butt";
  for(let i=0;i<=13;i++){
    const x=X(i);
    cx.strokeStyle= i===13 ? "rgba(240,246,242,0.95)" : "rgba(206,220,228,0.52)";
    cx.lineWidth= i===13 ? 3.5 : 1.25;
    cx.beginPath(); cx.moveTo(x,1232); cx.lineTo(x,1256); cx.stroke();
  }
  const xm=X(7.65);
  cx.strokeStyle=C.gold; cx.lineWidth=5.5;
  cx.beginPath(); cx.moveTo(xm,1230); cx.lineTo(xm,1258); cx.stroke();

  // the edge-on document, held back at 45 percent
  S.litPool(cx,858,748,240,44);
  S.cast(cx,858,736,94,{dy:2,k:3.0});
  S.document(cx,{x:716,y:700,w:284,thick:34,alpha:0.56,seed:562});
  S.seam(cx,716,1000,732,0.66);

  cx.strokeStyle="rgba(120,142,158,0.30)"; cx.lineWidth=0.75;
  cx.beginPath(); cx.moveTo(80,160); cx.lineTo(1000,160); cx.stroke();
  const ip=AKGeo.alaskaProjection(ak,[[4,18],[108,94]]);
  S.indexDiagram(cx,d3.geoPath(ip)(ak),[60,58,11,9]);

  /* No __akLeaders on this sheet. The dimension call across the outflow throat
     is a MEASUREMENT MARK, not a leader pointing at a named feature, and the
     dot-value note lives in the margin where the art can't reach it. Declaring
     a leader nothing draws would be the slide contradicting itself. */
  AKPOST.grade(cx,{exposure:0.04,saturation:1.04,contrast:1.06,filmic:true,dither:true,grain:{amount:0.045,size:2,seed:20260912},sharpen:0.30});
  return true;
})();
</script></body></html>
