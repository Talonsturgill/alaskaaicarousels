<canvas id="art" width="2160" height="2700"></canvas>

<div class="mn" id="ct" data-reserve style="left:836px;top:96px;width:148px;font-size:26px;text-align:right;color:#C4CFC6" data-decorative>09 / 09</div>

<h1 class="hd" id="h1" data-reserve data-bloom style="left:96px;top:290px;width:640px;height:300px;font-size:62px">A test can settle<br>a measurement.<br>It can't settle<br>what a count is for.</h1>

<div class="mn" data-reserve data-bloom style="left:96px;top:838px;width:880px;font-size:24px;color:#20291F;line-height:1.46">PROPOSITION 3 LOCKS FOR TWO YEARS ONCE IT PASSES.<br>OCTOBER 6TH, 2026.</div>

<div class="mn" data-reserve style="left:640px;top:1208px;width:360px;font-size:20px;text-align:right;color:#46503F" data-decorative>64&#176;50'N . 147&#176;43'W</div>

<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/akcolor.js"></script>
<script src="@@ASSETS@@/js/aktype.js"></script>
<script src="@@ASSETS@@/js/akpost.js"></script>
<script src="@@ASSETS@@/js/akseam.js"></script>
<script>
/* ============================================================
   SLIDE 09 — CLOSE. ONE ASK.
   The wide bookend, framing matched to slide 01. The riffle closes to a
   12 percent seam, the two columns of sheet edges come back together, and
   the threshold rule that has run unlit through eight slides contracts to a
   point and becomes the gold Polaris. That is the deck's last gold and its
   only seal.
   ============================================================ */
var W=1080, H=1350;
var CV=document.getElementById('art'), CX=CV.getContext('2d');
CX.scale(2,2);
AK.reseed(20260902);

var LEE='#141B25', MID='#9AA08C', ARRIS='#D9DCC6', CREST='#F1F2E4',
    PAPER_LIT='#CBD2BE', GOLD='#FFC72C';

/* framing matched to the cover: same sheet count, same near pitch, same ratio */
var NS=205, P_NEAR=24, RATIO=0.9856;
var yTop=[], pit=[];
(function(){ var y=H+30,p=P_NEAR; for(var i=0;i<NS;i++){ y-=p; yTop.push(y); pit.push(p); p*=RATIO; } })();
function sh(i,k){ var s=Math.sin((i*127.1+k*311.7)*0.731)*43758.5453; return s-Math.floor(s); }
var reach=[], lean=[], proud=[];
for(var i=0;i<NS;i++){
  var smooth=AK.simplex2(i*0.055,3.1)*0.5+AK.simplex2(i*0.19,7.7)*0.16;
  reach.push(Math.max(0.28, Math.min(1.06, 0.80+smooth*0.30+((sh(i,4)>0.955)?0.13:0))));
  lean.push((sh(i,2)-0.5)*1.4); proud.push(sh(i,3)>0.945);
}
function skew(x){ return -x*0.042; }

/* THE SEAM CLOSING. 12 percent, fan 3 degrees, and it seals. */
function riffle(x,y){
  if(x<52||x>1000||y<250||y>1290) return 0;
  var lat=Math.min(1,Math.min(x-52,1000-x)/220);
  var t=(y-250)/1040;
  return lat*Math.pow(Math.sin(Math.PI*t),0.36);
}
var SPLAY=2.2;

/* reserve, broken strokes and the open-fan bloom are AKSEAM house
   machinery; this slide supplies only its own pads. */
var RESV=null;
function measureReserve(){ RESV=AKSEAM.reserve('[data-reserve]',[24,24,24,22]); }
function inRes(x,y,pad){ return RESV.hit(x,y,pad); }
function segBlocked(fy,x,step,pad){ return RESV.seg(fy,x,step,pad); }
function strokeBroken(fy,x0,x1,step,lw,color){ AKSEAM.strokeBroken(CX,RESV,fy,x0,x1,step,lw,color); }
function fanBloom(){ AKSEAM.bloom(CX,{margin:[30,30,30,26],grow:[86,74],mid:0.66,midA:0.56}); }


function seamHalf(gx){
  /* the lane breathes but never closes; it is one lane the whole way */
  return 58 + 26 * AK.simplex2(gx * 0.0011, 55.1);
}
/* draws the lit pass. Call it AFTER the mass and AFTER the blooms, and give it
   the slide's own edgeY/reach so the lit arrises are the slide's real sheets.

   TWO PASSES, and the first is the one that makes the seam true. The slide's
   own sheets only reach the right frame edge when their reach noise happens to
   send them there, so relying on them alone left four of the eight seams with
   no lit band at the edge at all, measured off the render. The lane therefore
   carries its OWN sheets: nine arrises whose path is a pure function of
   globalX, running the full 0 to 1080 and off both edges. At x = 1080 on slide
   n and x = 0 on slide n+1 the globalX is the same number, so line k arrives
   and departs at the same height, at every seam, by construction. The slide's
   real sheets are then lit inside the same band as texture on top. */
function seamLane(slideNo, xEndFor, edgeYFn, _ignored){
  var G0 = (slideNo - 1) * 1080;
  /* THE LANE KEEPS ITS OWN RESERVE TEST. Each slide's inRes has a different
     signature and a different pad, and the lane's strokes are up to 3.1 px
     wide, so it measures the boxes itself with a pad that covers the stroke
     and tests the SEGMENT between samples rather than the samples. */
  var SB = [];
  (function(){
    var els = document.querySelectorAll('[data-reserve]');
    for(var i=0;i<els.length;i++){ var r = els[i].getBoundingClientRect();
      SB.push([r.left - 20, r.top - 18, r.right + 20, r.bottom + 16]); }
  })();
  function hit(x, y){
    for(var i=0;i<SB.length;i++){ var b = SB[i];
      if(x >= b[0] && x <= b[2] && y >= b[1] && y <= b[3]) return true; }
    return false;
  }
  function reserveTest(x, y){
    return hit(x - 4, y) || hit(x, y) || hit(x + 4, y) || hit(x, y - 4) || hit(x, y + 4);
  }
  CX.save();

  /* PASS 1. THE LANE'S OWN SHEETS, a pure function of globalX. */
  (function(){
    var K = 9;
    for(var k=0;k<K;k++){
      var f = (k + 0.5) / K, off = (f * 2 - 1);
      var a = Math.pow(1 - Math.abs(off), 1.15);
      CX.globalAlpha = 0.24 + 0.60 * a;
      CX.lineWidth = 0.9 + 2.2 * a;
      CX.strokeStyle = '#F1F2E4';
      var open = false;
      for(var x=-8; x<=1088; x+=6){
        var gx = G0 + x;
        var y = seamY(gx) + off * seamHalf(gx) + 5.5 * AK.simplex2(gx * 0.0042, 30 + k * 7);
        if(reserveTest && reserveTest(x, y)){ if(open){ CX.stroke(); open = false; } continue; }
        if(!open){ CX.beginPath(); CX.moveTo(x, y); open = true; } else CX.lineTo(x, y);
      }
      if(open) CX.stroke();
      /* each lit arris keeps its own lee, so the lane is stacked paper */
      CX.globalAlpha = (0.24 + 0.60 * a) * 0.55;
      CX.lineWidth = 1.0; CX.strokeStyle = '#0B1118';
      open = false;
      for(var x2=-8; x2<=1088; x2+=6){
        var gx2 = G0 + x2;
        var y2 = seamY(gx2) + off * seamHalf(gx2) + 5.5 * AK.simplex2(gx2 * 0.0042, 30 + k * 7) + 3.0;
        if(reserveTest && reserveTest(x2, y2)){ if(open){ CX.stroke(); open = false; } continue; }
        if(!open){ CX.beginPath(); CX.moveTo(x2, y2); open = true; } else CX.lineTo(x2, y2);
      }
      if(open) CX.stroke();
    }
  })();

  /* PASS 2. the slide's real sheets, lit inside the same band. */
  for(var i=0;i<NS;i++){
    var xEnd = xEndFor(i); if(xEnd < 40) continue;
    var open = false, lastA = 0;
    for(var x=0; x<=xEnd; x+=7){
      var y = edgeYFn(i, x);
      var gx = G0 + x;
      var d = Math.abs(y - seamY(gx)) / seamHalf(gx);
      if(d >= 1 || (reserveTest && reserveTest(x, y))){
        if(open){ CX.stroke(); open = false; }
        continue;
      }
      var a = Math.pow(1 - d, 1.35);           /* soft across the lane, hard at no point */
      if(!open || Math.abs(a - lastA) > 0.18){
        if(open) CX.stroke();
        CX.beginPath(); CX.moveTo(x, y); open = true;
        CX.globalAlpha = 0.30 + 0.52 * a;
        CX.lineWidth = 0.9 + 1.9 * a;
        CX.strokeStyle = '#F1F2E4';
        lastA = a;
      } else {
        CX.lineTo(x, y);
      }
    }
    if(open) CX.stroke();
  }
  /* the lee under the lit pass, so the band has a bottom and reads as light
     falling across the mass rather than as a painted stripe */
  for(var i2=0;i2<NS;i2++){
    var xEnd2 = xEndFor(i2); if(xEnd2 < 40) continue;
    var open2 = false;
    CX.globalAlpha = 0.30; CX.lineWidth = 1.1; CX.strokeStyle = '#0B1118';
    for(var x2=0; x2<=xEnd2; x2+=7){
      var y2 = edgeYFn(i2, x2) + 2.4;
      var gx2 = G0 + x2;
      var d2 = Math.abs(y2 - seamY(gx2)) / seamHalf(gx2);
      if(d2 >= 0.86 || (reserveTest && reserveTest(x2, y2))){
        if(open2){ CX.stroke(); open2 = false; } continue;
      }
      if(!open2){ CX.beginPath(); CX.moveTo(x2, y2); open2 = true; } else CX.lineTo(x2, y2);
    }
    if(open2) CX.stroke();
  }
  CX.restore();
}



window.renderReady = new Promise(function(resolve){ (async function(){
  await document.fonts.ready;
  measureReserve();

  var g=CX.createLinearGradient(980,0,80,H);
  g.addColorStop(0,'#0B121A'); g.addColorStop(.5,LEE); g.addColorStop(1,'#0A1017');
  CX.fillStyle=g; CX.fillRect(0,0,W,H);

  var STEP=9;
  function edgeY(i,x){ var y0=yTop[i]+lean[i]+skew(x);
    return y0 + riffle(x,y0)*(y0-770)*0.09; }
  function lp(i,x){ var y0=yTop[i]+lean[i]+skew(x);
    return pit[i]*(1+SPLAY*riffle(x,y0)); }

  for(var i=NS-1;i>=0;i--){
    var xEnd=Math.min(W, 120+(W-40)*reach[i]); if(xEnd<60) continue;
    CX.beginPath();
    for(var x=0;x<=xEnd;x+=STEP){ CX.lineTo(x, edgeY(i,x)); }
    for(var x2=xEnd;x2>=0;x2-=STEP){ CX.lineTo(x2, edgeY(i,x2)+lp(i,x2)); }
    CX.closePath();
    var yM=edgeY(i,400), r=riffle(400,yM), depth=Math.min(1,pit[i]/20);
    /* THE STEEPEST LAMP FALLOFF IN THE DECK across the lower band: the
       material darkens by about 30 L* while staying fully drawn. */
    var fall=Math.max(0, (yM-1000)/350)*0.30;
    CX.fillStyle=AKC.mixOklab(LEE, PAPER_LIT, Math.max(0.04, Math.min(1, 0.10+0.32*depth+0.54*r-fall)));
    CX.fill();
    (function(ii,rr,dd,ff){
      strokeBroken(function(x){return edgeY(ii,x);},0,xEnd,STEP,
        Math.max(0.6, lp(ii,400)*0.28), 'rgba(12,17,25,'+(0.70-0.30*rr)+')');
      CX.lineCap='butt';
      strokeBroken(function(x){return edgeY(ii,x)-0.6;},0,xEnd,STEP,
        Math.max(0.55,0.55+dd*1.2), AKC.mixOklab(MID, ARRIS, Math.max(0.06,0.28+0.60*dd-ff*1.4)));
    })(i,r,depth,fall);
  }

  fanBloom();

  /* ---- ONE LIFTED SHEET CORNER, catching a real specular crest, with its
     own small cast shadow. The anchor event in the lower band. ---- */
  (function(){
    var cx0=792, cy0=1092;
    CX.save();
    /* the cast, first, so the corner sits in it */
    CX.beginPath(); CX.moveTo(cx0-6,cy0+8); CX.lineTo(cx0+128,cy0-16); CX.lineTo(cx0+132,cy0+6); CX.lineTo(cx0-4,cy0+26); CX.closePath();
    CX.fillStyle='rgba(6,9,14,0.62)'; CX.fill();
    /* the lifted corner itself */
    CX.beginPath(); CX.moveTo(cx0,cy0); CX.lineTo(cx0+124,cy0-30); CX.lineTo(cx0+120,cy0-6); CX.lineTo(cx0+2,cy0+18); CX.closePath();
    var lgc=CX.createLinearGradient(cx0,cy0,cx0+124,cy0-30);
    lgc.addColorStop(0,AKC.mixOklab(LEE,PAPER_LIT,0.34));
    lgc.addColorStop(1,CREST);
    CX.fillStyle=lgc; CX.fill();
    CX.lineWidth=1.25; CX.strokeStyle=CREST; CX.stroke();
    CX.restore();
  })();

  /* ---- THE POLARIS SEAL. The threshold rule, which has run unlit through
     eight slides, contracts to a point and becomes the deck's last gold. ---- */
  (function(){
    var px=940, py=1120, r=19;
    CX.save();
    var gl=CX.createRadialGradient(px,py,1,px,py,r*2.1);
    gl.addColorStop(0,'rgba(255,199,44,0.55)'); gl.addColorStop(1,'rgba(255,199,44,0)');
    CX.fillStyle=gl; CX.beginPath(); CX.arc(px,py,r*2.1,0,6.2832); CX.fill();
    CX.fillStyle=GOLD;
    /* a four point star, spike length keyed to the glow radius */
    CX.beginPath();
    CX.moveTo(px, py-r*1.55); CX.lineTo(px+r*0.30, py-r*0.30);
    CX.lineTo(px+r*1.55, py); CX.lineTo(px+r*0.30, py+r*0.30);
    CX.lineTo(px, py+r*1.55); CX.lineTo(px-r*0.30, py+r*0.30);
    CX.lineTo(px-r*1.55, py); CX.lineTo(px-r*0.30, py-r*0.30);
    CX.closePath(); CX.fill();
    CX.lineWidth=1.0; CX.strokeStyle='rgba(28,22,6,0.55)'; CX.stroke();
    CX.restore();
  })();

  AK.fitText(document.getElementById('h1'), {min:52, max:66, maxLines:4});


  /* THE LAY RUNS THROUGH THE RESERVE (2026-09-02, three critics independently).
     The bloom lifts the lane so ink can sit on it, and in doing so it erases
     the one thing that made the lane PAPER: the sheet arrises. What is left is
     a soft-edged bright rectangle, which is the plate Device A forbids by name,
     and it is also why the near band kept reading as dead to frame_balance no
     matter how much grading went into it. So the arrises go back across the
     WHOLE frame, reserve included, at a contrast far below the type's. Uniform
     is the point: the qa check that guards reserved text compares a line
     against its own block-mates, and a veil that treats every line alike gives
     it nothing to single out. */







  /* house machinery, AKSEAM: the deck-wide panorama seam and the two passes
     that keep this slide's type reserve made of the same material as its art */
  AKSEAM.veil(CX,{ns:NS, h:H, a0:0.09, a1:0.12,
    xEnd:function(i){ return Math.min(W, 120+(W-40)*reach[i]); },
    baseY:function(i){ return yTop[i]+lean[i]; },
    edgeY:function(i,x){ return edgeY(i,x); }});
  AKSEAM.lane(CX,{slide:9, ns:NS,
    xEnd:function(i){ return Math.min(W, 120+(W-40)*reach[i]); },
    edgeY:function(i,x){ return edgeY(i,x); }});
  AKSEAM.lineLift(CX);

  AKPOST.grade(CX,{w:W,h:H,exposure:-0.04,saturation:1.02,contrast:1.07,filmic:true,
    vignette:0.18, bloom:{threshold:0.84,strength:0.07,radius:12},
    grain:{amount:0.05,size:2,seed:20260902}, dither:true, sharpen:0.34});
  resolve();
})(); });
</script></body></html>
