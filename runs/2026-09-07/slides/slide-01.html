<!doctype html>
<!-- SLIDE 01 — COVER. "A COMMA HIDES $20,632,119.41".
     Hero: THE CURVED TRANSECT. A PBR-lit sphere from akthree under a d3
     orthographic overlay carrying the Alaska coastline, the graticule, and the
     Anchorage-to-Pentagon geodesic with a hard 34px break in it. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden}
  body{background:#050A14;position:relative}
  #art{position:absolute;inset:0}
  #grain{position:absolute;inset:0;background-repeat:repeat;mix-blend-mode:overlay;
         opacity:.07;pointer-events:none}
  .type{position:absolute;left:80px;top:206px;width:624px}
  h1{font-family:"Unbounded",sans-serif;font-weight:700;font-size:108px;line-height:.98;
     letter-spacing:-.02em;color:#EAF1FA;margin-left:-6px}
  .fig{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:72px;line-height:1.06;
       color:#EAF1FA;font-variant-numeric:tabular-nums lining-nums;margin-top:22px;
       letter-spacing:-.03em}
  .bodyline{font-family:"Manrope",sans-serif;font-weight:500;font-size:34px;line-height:1.38;
        color:#9DB2C8;margin-top:28px;max-width:470px}
  .polaris{position:absolute;right:83px;top:78px;width:18px;height:18px;line-height:0}
  .rail{position:absolute;right:82px;top:120px;font-family:"JetBrains Mono",monospace;
        font-weight:400;font-size:24px;letter-spacing:.10em;color:#8FA6BE;
        writing-mode:vertical-rl;text-orientation:mixed}
  .prov{position:absolute;left:80px;bottom:56px;font-family:"JetBrains Mono",monospace;
        font-size:24px;letter-spacing:.10em;color:#63788F}
</style></head>
<body>
<canvas id="art" width="2160" height="2700" style="width:1080px;height:1350px"></canvas>
<div id="grain"></div>
<div class="type">
  <h1 id="hd">A COMMA HIDES</h1>
  <div class="fig">$20,632,119.41</div>
  <div class="bodyline">from the public's own search for AI contracts</div>
</div>
<div class="polaris"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 0 L10.15 7.85 L18 9 L10.15 10.15 L9 18 L7.85 10.15 L0 9 L7.85 7.85 Z" fill="#FFC72C"/><circle cx="9" cy="9" r="1.5" fill="#FFC72C"/></svg></div>
<div class="rail">61.2181N 149.9003W . t 0.00 . 0 MI . 01 / 09</div>
<div class="prov" data-decorative>FPDS-NG READ 2026-09-07</div>

<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/akcolor.js"></script>
<script src="@@ASSETS@@/js/aktype.js"></script>
<script src="@@ASSETS@@/js/akpost.js"></script>
<script src="@@ASSETS@@/js/d3.v7.min.js"></script>
<script type="module">
const W=1080,H=1350,SEED=20260907+1;
const ANC=[-149.9003,61.2181], PEN=[-77.0563,38.8719];
const S=1092, CX=898, CY=262;               // Anchorage sits here; arc descends the right third
window.renderReady=(async()=>{
  const cv=document.getElementById('art'), cx=cv.getContext('2d');
  cx.scale(2,2);

  /* ---- 1. the lit sphere, akthree GPU PBR, rendered offscreen ---------- */
  let sphereOK=false, off=document.createElement('canvas');
  off.width=W*2; off.height=H*2; off.style.width=W+'px'; off.style.height=H+'px';
  try{
    const THREE=await import('@@ASSETS@@/js/three.module.min.js');
    const AKT=(await import('@@ASSETS@@/js/akthree.js')).init(THREE);
    if(AKT.webglOK()){
      const R=AKT.setup(off,{w:W,h:H,bg:0x050A14,exposure:0.88});
      // orthographic so the three.js silhouette matches d3.geoOrthographic(S)
      const hw=(W/2)/S, hh=(H/2)/S;
      const cam=new THREE.OrthographicCamera(-hw,hw,hh,-hh,0.01,40);
      cam.position.set(0,0,6); cam.lookAt(0,0,0); R.camera=cam;
      // sphere centre must land at CX,CY, so offset the mesh in world units
      const ox=(CX-W/2)/S, oy=-(CY-H/2)/S;
      const globe=new THREE.Mesh(new THREE.SphereGeometry(1,192,128),
        new THREE.MeshStandardMaterial({color:0x102338,roughness:0.70,metalness:0.10}));
      globe.position.set(ox,oy,0); R.scene.add(globe);
      AKT.environment(R,{intensity:0.16});
      // ONE key at az 142 el 4. screen north is +y, east is +x.
      const az=142*Math.PI/180, el=4*Math.PI/180;
      const kd=[Math.sin(az)*Math.cos(el), Math.cos(az)*Math.cos(el), Math.sin(el)];
      const key=new THREE.DirectionalLight(0xBFD4EA,3.15);
      key.position.set(kd[0]*8+ox, kd[1]*8+oy, kd[2]*8+6); R.scene.add(key);
      const fill=new THREE.DirectionalLight(0x16283E,0.52);   // 6:1
      fill.position.set(-kd[0]*8+ox,-kd[1]*8+oy, 5); R.scene.add(fill);
      R.scene.add(new THREE.AmbientLight(0x081221,0.55));
      // atmospheric limb shell, additive, so the sphere has an edge and the
      // lower band carries modeled tone rather than going flat
      const shell=new THREE.Mesh(new THREE.SphereGeometry(1.045,160,110),
        new THREE.MeshBasicMaterial({color:0x24486B,transparent:true,opacity:0.10,
          side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false}));
      shell.position.set(ox,oy,0); R.scene.add(shell);
      const shot=await AKT.snapshot(R);
      if(shot&&shot.ok){ cx.drawImage(off,0,0,W,H); sphereOK=true; }
    }
  }catch(e){ console.warn('akthree unavailable',e&&e.message); }

  if(!sphereOK){   // designed Canvas fallback: same terminator, no GPU
    const g=cx.createRadialGradient(CX+430,CY+540,40,CX,CY,S);
    g.addColorStop(0,'#2A4665'); g.addColorStop(.45,'#16293F');
    g.addColorStop(.8,'#0B1626'); g.addColorStop(1,'#070E1A');
    cx.save(); cx.beginPath(); cx.arc(CX,CY,S,0,7); cx.clip();
    cx.fillStyle=g; cx.fillRect(0,0,W,H); cx.restore();
  }

  /* ---- 1b. space is not dead. graded starfield + atmospheric limb ------ */
  const RESERVE=[[64,190,656,440],[64,1250,420,70],[1000,100,80,780]];
  function reserved(x,y){ for(const r of RESERVE){
      if(x>r[0]-10&&x<r[0]+r[2]+10&&y>r[1]-10&&y<r[1]+r[3]+10) return true; } return false; }
  function clipOutsideReserves(){
    cx.beginPath(); cx.rect(0,0,W,H);
    for(const r of RESERVE) cx.rect(r[0]-8,r[1]-8,r[2]+16,r[3]+16);
    cx.clip('evenodd');
  }
  {
    const rs=AK.rng(SEED+91);
    cx.save();
    for(let k=0;k<520;k++){
      const x=rs()*W, y=rs()*H;
      const d=Math.hypot(x-CX,y-CY);
      if(d<S-2) continue;                       // stars live off the globe only
      if(reserved(x,y)) continue;               // and never inside a type reserve
      const near=Math.max(0,1-(d-S)/520);       // denser and brighter near the limb
      const m=rs();
      const a=(0.05+0.30*m*m)*(0.35+0.65*near);
      const r=m>0.94?1.5:(m>0.72?1.05:0.7);
      cx.fillStyle='rgba(198,216,232,'+a.toFixed(3)+')';
      cx.beginPath(); cx.arc(x,y,r,0,7); cx.fill();
    }
    // atmospheric limb, an additive band hugging the outside of the silhouette
    const lim=cx.createRadialGradient(CX,CY,0,CX,CY,S+96);
    const _i=(S-14)/(S+96), _l=(S-4)/(S+96), _m=_l+0.30*(1-_l);
    lim.addColorStop(0,'rgba(84,140,192,0)'); lim.addColorStop(_i,'rgba(84,140,192,0)');
    lim.addColorStop(_l,'rgba(84,140,192,0.30)'); lim.addColorStop(_m,'rgba(52,96,142,0.12)');
    lim.addColorStop(1,'rgba(30,60,100,0)');
    cx.globalCompositeOperation='lighter';
    cx.fillStyle=lim; cx.fillRect(0,0,W,H);
    cx.restore();
  }

  /* ---- 2. the projection, roll solved numerically --------------------- */
  const CEN=[ANC[0], Math.min(88,ANC[1]+10)];      // 10 deg off-arc so it bows
  function proj(gamma){ return d3.geoOrthographic()
    .rotate([-CEN[0],-CEN[1],gamma]).translate([CX,CY]).scale(S).clipAngle(90); }
  let p0=proj(0), a0=p0(ANC), b0=p0(PEN);
  let gamma=Math.atan2(b0[0]-a0[0], b0[1]-a0[1])*180/Math.PI;
  let P=proj(gamma), a=P(ANC), b=P(PEN);
  if(Math.abs(a[0]-b[0])>6){ P=proj(-gamma); a=P(ANC); b=P(PEN); gamma=-gamma; }
  window.__akChecks={rollDeltaX:Math.abs(a[0]-b[0]), gamma:gamma};
  const path=d3.geoPath(P,cx);

  /* ---- 3. graticule, hair weight -------------------------------------- */
  cx.save(); clipOutsideReserves();
  cx.lineWidth=.75; cx.strokeStyle='rgba(143,166,190,0.17)';
  cx.beginPath(); path(d3.geoGraticule().step([15,10])()); cx.stroke(); cx.restore();

  /* ---- 4. Alaska coastline, cased ------------------------------------- */
  const ak=await (await fetch('@@ASSETS@@/geo/alaska-state.geo.json')).json();
  cx.save(); clipOutsideReserves();
  cx.lineJoin='round'; cx.lineCap='butt';
  cx.lineWidth=4.0; cx.strokeStyle='rgba(5,10,20,0.85)';
  cx.beginPath(); path(ak); cx.stroke();
  cx.lineWidth=1.25; cx.strokeStyle='#7E9AB6';
  cx.beginPath(); path(ak); cx.stroke();
  cx.restore();

  /* ---- 5. the geodesic, 512 samples, with a hard break ---------------- */
  const interp=d3.geoInterpolate(ANC,PEN), N=512;
  const pts=[]; for(let i=0;i<N;i++) pts.push(P(interp(i/(N-1))));
  // choose the break so it measures ~34 design px on screen
  let mid=Math.round(N*0.50), acc=0, i0=mid, i1=mid;
  while(acc<34 && i1<N-2){ i1++; acc=Math.hypot(pts[i1][0]-pts[i0][0],pts[i1][1]-pts[i0][1]); }
  function seg(from,to,w,col){ cx.save(); cx.lineWidth=w; cx.strokeStyle=col;
    cx.lineCap='butt'; cx.beginPath(); cx.moveTo(pts[from][0],pts[from][1]);
    for(let i=from+1;i<=to;i++) cx.lineTo(pts[i][0],pts[i][1]); cx.stroke(); cx.restore(); }
  seg(0,i0,4.0,'rgba(5,10,20,0.8)'); seg(i1,N-1,4.0,'rgba(5,10,20,0.8)');
  seg(0,i0,2.6,'#C6D8E8');           seg(i1,N-1,2.6,'#C6D8E8');
  const gapMid=[(pts[i0][0]+pts[i1][0])/2,(pts[i0][1]+pts[i1][1])/2];

  /* ---- 6. specular streak on water, one direction, el 4 --------------- */
  const rnd=AK.rng(SEED);
  cx.save(); cx.globalCompositeOperation='lighter';
  for(let k=0;k<220;k++){
    const t=rnd(), u=rnd();
    const x=CX-620+t*1500, y=CY+300+u*760;
    const d=Math.hypot(x-CX,y-CY); if(d>S) continue;
    const a2=0.05*(1-u)*(1-Math.abs(t-.55));
    cx.strokeStyle='rgba(62,110,150,'+a2.toFixed(3)+')';
    cx.lineWidth=1.1; cx.beginPath(); cx.moveTo(x,y); cx.lineTo(x+26,y-20); cx.stroke();
  }
  cx.restore();

  /* ---- 7. the gold comma, seated IN the gap --------------------------- */
  cx.save();
  cx.fillStyle='#FFC72C'; cx.font='700 44px Unbounded, sans-serif';
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.shadowColor='rgba(255,199,44,0.70)'; cx.shadowBlur=22;
  cx.fillText(',', gapMid[0], gapMid[1]-8);
  cx.restore();

  /* ---- 8. film grade -------------------------------------------------- */
  AKPOST.grade(cx,{w:W,h:H,exposure:-0.20,saturation:0.95,contrast:1.14,filmic:true,
    lift:[0.010,0.014,0.024],gain:[1.012,1.0,0.978],vignette:0.22,
    bloom:{threshold:0.80,strength:0.22,radius:9},
    grain:{amount:0.040,size:2,seed:SEED},aberration:0.6,dither:true,sharpen:0.30});

  document.getElementById('grain').style.backgroundImage='url('+AK.grainTile(280,46,SEED)+')';
  await document.fonts.ready;
  AK.fitText(document.getElementById('hd'),{min:76,max:116,maxLines:2});

  window.__akMotifs=[{what:"the break in the transect, the deck's continuity gap",
                      rect:[Math.round(gapMid[0]-60),Math.round(gapMid[1]-46),120,92]}];
  document.body.setAttribute('data-encodes', JSON.stringify([{
    claim:"the transect is lit at the Washington end and dark at the Alaska end",
    reads:"differ",
    a:[[Math.round(CX+180),Math.round(CY+430),260,150]],
    b:[[Math.round(CX-300),Math.round(CY-330),260,150]]}]));
  return true;
})();
</script>
</body></html>
