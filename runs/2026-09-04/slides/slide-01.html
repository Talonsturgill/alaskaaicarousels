<!doctype html>
<!-- SLIDE 01, COVER. THE RULED WORLD AND THE UNRULED ONE.
     Camera 1.5 m, 48 mm, level, horizon at 26 percent from the bottom.
     Key azimuth 318, elevation 9. Key to fill 6 to 1.
     The deck's law, stated once here and obeyed on all nine frames. THE GROUND
     CARRIES NO STROKES. Every straight line in the deck belongs to the
     document, and on this slide the document is one 18 px tick cut by the
     right edge. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { background: #04070E; position: relative; font-family: "Manrope", sans-serif; }
  canvas { position: absolute; left: 0; top: 0; }
  .grain { position: absolute; inset: 0; opacity: 0.06; mix-blend-mode: overlay;
           background-repeat: repeat; }
  .kicker { position: absolute; left: 96px; top: 92px;
            font-family: "JetBrains Mono", monospace; font-weight: 500;
            font-size: 26px; letter-spacing: 0.10em; color: #9AA98C; }
  h1 { position: absolute; left: 96px; top: 178px; width: 880px; height: 330px;
       font-family: "Bricolage Grotesque", sans-serif; font-weight: 700;
       font-size: 92px; line-height: 0.98; letter-spacing: -0.02em;
       color: #E8EEF5; }
  .prov { position: absolute; left: 96px; bottom: 78px; width: 560px;
          font-family: "JetBrains Mono", monospace; font-weight: 400;
          font-size: 16px; letter-spacing: 0.13em; line-height: 1.5;
          color: rgba(154,169,140,0.50); }
  .counter { position: absolute; right: 80px; bottom: 80px;
             font-family: "JetBrains Mono", monospace; font-weight: 500;
             font-size: 24px; letter-spacing: 0.10em; color: #9AA98C; }
  .counter i { color: #FFC72C; font-style: normal; }
  .polaris { position: absolute; right: 84px; top: 96px; width: 26px; height: 26px; }
</style>
</head>
<body>
  <canvas id="art" width="2160" height="2700" style="width:1080px;height:1350px"></canvas>
  <div class="grain" id="grain"></div>

  <div class="kicker" data-reserve>ADL 234762 &middot; MATANUSKA-SUSITNA BOROUGH</div>
  <h1 data-reserve>19,950 acres.<br>Three state notices.<br>None says data center.</h1>
  <div class="prov" data-reserve data-decorative>GROUND DRAWN FROM THE NOTICE'S TOWNSHIP DESCRIPTION. NOT A SURVEY.</div>
  <div class="counter" data-reserve>01 <i data-decorative>/</i> 09</div>
  <svg class="polaris" viewBox="0 0 26 26" aria-hidden="true">
    <path d="M13 0 L15.1 10.9 L26 13 L15.1 15.1 L13 26 L10.9 15.1 L0 13 L10.9 10.9 Z" fill="#FFC72C"/>
  </svg>

<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/akcolor.js"></script>
<script src="@@ASSETS@@/js/aktype.js"></script>
<script src="@@ASSETS@@/js/akparcel.js"></script>
<script src="@@ASSETS@@/js/akstipple.js"></script>
<script src="@@ASSETS@@/js/akhachure.js"></script>
<script src="@@ASSETS@@/js/akengrave.js"></script>
<script src="@@ASSETS@@/js/akpost.js"></script>
<script>
window.renderReady = new Promise(function (resolve) {
  (async function () {

  var SEED = 20260904;
  var W = 1080, H = 1350;
  var HORIZON = 624;                     /* ground is 54 percent of the frame */
  var cx = document.getElementById('art').getContext('2d');
  cx.scale(2, 2);

  var SKY_TOP = '#04070E', SKY_LOW = '#0B1524', FAR = '#0B1524';
  var PEAT = '#16283C', SPRUCE_D = '#22423A', SPRUCE_L = '#3C5C46';
  var TUSS_L = '#6F7F85', SPHAG = '#9AA98C', AMBER = '#8A6438';

  await document.fonts.ready;
  /* THE HEADLINE IS FITTED, NEVER GUESSED. A CSS font-size on a fixed box
     wrapped this to five lines on the first render and ate two thirds of the
     frame. maxLines is the declaration qa.py checks. */
  AK.fitText(document.querySelector('h1'), { min: 58, max: 92, maxLines: 3 });
  AKPARCEL.reserve('[data-reserve]');

  /* ---------- sky, with the amber horizon band that drains across the deck ---- */
  function sky() {
    var g = cx.createLinearGradient(0, 0, 0, HORIZON);
    g.addColorStop(0.00, SKY_TOP);
    g.addColorStop(0.62, '#071021');
    g.addColorStop(1.00, SKY_LOW);
    cx.fillStyle = g; cx.fillRect(0, 0, W, HORIZON);

    /* The amber band is 8 percent of frame area on this slide and it has a
       MODELLED UPPER EDGE against the tree line rather than a soft ramp,
       because a soft ramp is the thing that dies at 432 px. */
    var bandH = 108, y0 = HORIZON - bandH;
    var ag = cx.createLinearGradient(0, y0, 0, HORIZON);
    ag.addColorStop(0.00, 'rgba(138,100,56,0.00)');
    ag.addColorStop(0.55, 'rgba(138,100,56,0.30)');
    ag.addColorStop(1.00, 'rgba(138,100,56,0.52)');
    cx.fillStyle = ag; cx.fillRect(0, y0, W, bandH);

    /* three stars, low and north. SOFT POINTS, never four ray crosses: a
       registration cross is the most diagrammatic mark in the drafting
       alphabet, and three of them floating in the sky argue against this
       frame's whole claim to be country rather than a diagram. They are also
       six straight segments that belong to no document, which this deck's one
       rule forbids. */
    var sr = AK.rng(SEED + 3);
    for (var i = 0; i < 3; i++) {
      var sx = 210 + i * 268 + sr() * 60, sy = 150 + sr() * 180, r = 2.2 + sr() * 0.8;
      var sg2 = cx.createRadialGradient(sx, sy, 0, sx, sy, r * 3.4);
      sg2.addColorStop(0.00, 'rgba(194,203,186,0.62)');
      sg2.addColorStop(0.34, 'rgba(194,203,186,0.26)');
      sg2.addColorStop(1.00, 'rgba(194,203,186,0)');
      cx.fillStyle = sg2;
      cx.beginPath(); cx.arc(sx, sy, r * 3.4, 0, Math.PI * 2); cx.fill();
    }
  }

  /* ---------- the far tree line, depth 0.92 ------------------------------ */
  /* Drawn at FULL contrast, then handed to AKPARCEL.band, which applies the
     per channel extinction once. Nothing here dims itself on distance. */
  function treeLine(bx) {
    var r = AK.rng(SEED + 11);
    var base = HORIZON + 4;
    for (var x = -20; x < W + 20; ) {
      var h = 26 + r() * 46;
      var w = 7 + r() * 8;
      var lean = (r() - 0.5) * 0.16;
      /* a black spruce is a narrow spire with a dense club near the top */
      bx.fillStyle = SPRUCE_D;
      bx.beginPath();
      bx.moveTo(x, base);
      bx.lineTo(x + w * 0.5 + lean * h, base - h);
      bx.lineTo(x + w, base);
      bx.closePath(); bx.fill();
      /* the club, which is what makes it read as black spruce */
      bx.beginPath();
      bx.ellipse(x + w * 0.5 + lean * h * 0.8, base - h * 0.78, w * 0.62, h * 0.20, lean, 0, Math.PI * 2);
      bx.fill();
      x += w * 0.62 + r() * 5;
    }
    /* a thin lit rim along the tops from the key at azimuth 318 */
    bx.globalAlpha = 0.5;
    bx.strokeStyle = SPRUCE_L; bx.lineWidth = 0.75;
    bx.beginPath();
    for (var gx = 0; gx <= W; gx += 6) bx.lineTo(gx, base - 30 - 16 * AK.fbm2(gx * 0.006, 4.1, 3));
    bx.stroke();
    bx.globalAlpha = 1;
  }

  /* ---------- the mid spruce rank, depth 0.55 ---------------------------- */
  function midSpruce(bx) {
    var r = AK.rng(SEED + 17);
    var base = HORIZON + 52;
    var n = 34;
    for (var i = 0; i < n; i++) {
      var x = -40 + (i / (n - 1)) * (W + 80) + (r() - 0.5) * 26;
      var h = 96 + r() * 118;
      var w = 15 + r() * 13;
      /* THE DRUNKEN FOREST. Peat gives, so a black spruce stand leans at every
         angle it was allowed to. Lean is a seeded normal about 0. */
      var lean = (r() + r() + r() - 1.5) * 0.20;
      var tipx = x + lean * h;
      bx.fillStyle = SPRUCE_D;
      bx.beginPath();
      bx.moveTo(x - w * 0.5, base); bx.lineTo(tipx, base - h); bx.lineTo(x + w * 0.5, base);
      bx.closePath(); bx.fill();
      /* whorls, drawn individually so the centimetre scale is real */
      var wn = 5 + Math.floor(r() * 4);
      for (var k = 0; k < wn; k++) {
        var t = 0.30 + (k / wn) * 0.62;
        var wy = base - h * t, ww = w * (1.05 - t * 0.62);
        var wxc = x + lean * h * t;
        bx.fillStyle = (k % 2 === 0) ? SPRUCE_L : SPRUCE_D;
        bx.beginPath();
        bx.ellipse(wxc, wy, ww, ww * 0.30, lean * 0.7, 0, Math.PI * 2);
        bx.fill();
      }
      /* key lit northwest edge, the only value that separates bole from bole */
      bx.strokeStyle = SPRUCE_L; bx.lineWidth = 1.25; bx.globalAlpha = 0.75;
      bx.beginPath(); bx.moveTo(x - w * 0.44, base); bx.lineTo(tipx - w * 0.06, base - h * 0.96);
      bx.stroke(); bx.globalAlpha = 1;
    }
  }

  /* ---------- THE MIDDLE DISTANCE, depth 0.45 ---------------------------- */
  /* Round two of this slide shipped a flat band between the tree line and the
     near tussocks, which is precisely the defect named in 8 of the last 10
     runs. It gets its own drawn population, its own material and its own pass.
     Low willow and dwarf birch scrub on a drainage shoulder, with small
     tussocks between, every stem drawn and NOTHING dimmed here on distance
     grounds. AKPARCEL.band does the attenuation afterwards. */
  function midScrub(bx) {
    var r = AK.rng(SEED + 37);
    var top = HORIZON + 60, bot = HORIZON + 300;

    /* the shoulder itself, a modelled rise rather than a flat fill */
    var sg = bx.createLinearGradient(0, top - 20, 0, bot + 40);
    sg.addColorStop(0, '#14283A'); sg.addColorStop(1, '#0F2030');
    bx.fillStyle = sg;
    bx.beginPath();
    bx.moveTo(-10, bot + 60);
    for (var gx = -10; gx <= W + 10; gx += 8) {
      bx.lineTo(gx, top + 26 - 22 * AK.fbm2(gx * 0.0042, 7.3, 4));
    }
    bx.lineTo(W + 10, bot + 60); bx.closePath(); bx.fill();

    /* about 150 willow and dwarf birch stems, each a two value stem */
    for (var i = 0; i < 150; i++) {
      var x = -20 + r() * (W + 40);
      var yb = top + 34 + Math.pow(r(), 0.6) * (bot - top - 20);
      var h = 16 + r() * 40;
      var bend = (r() - 0.5) * 16;
      bx.strokeStyle = '#2B4438'; bx.lineWidth = 1.25;
      bx.beginPath();
      bx.moveTo(x, yb);
      bx.quadraticCurveTo(x + bend * 0.5, yb - h * 0.6, x + bend, yb - h);
      bx.stroke();
      /* the key lit northwest side of the same stem, offset half a width */
      bx.strokeStyle = '#4E6B52'; bx.lineWidth = 0.75; bx.globalAlpha = 0.75;
      bx.beginPath();
      bx.moveTo(x - 0.9, yb);
      bx.quadraticCurveTo(x + bend * 0.5 - 0.9, yb - h * 0.6, x + bend - 0.9, yb - h);
      bx.stroke(); bx.globalAlpha = 1;
      /* leaf litter beneath, the millimetre scale */
      if (i % 3 === 0) {
        bx.fillStyle = '#6B5230'; bx.globalAlpha = 0.34;
        for (var l = 0; l < 5; l++) {
          bx.fillRect(x - 6 + r() * 12, yb + r() * 4, 1.8, 1.1);
        }
        bx.globalAlpha = 1;
      }
    }

    /* 46 small tussocks between the stems, so the mid band carries the same
       KIND of object as the near band at a genuinely different scale */
    for (var t2 = 0; t2 < 46; t2++) {
      var tx = -20 + r() * (W + 40);
      var ty = top + 50 + Math.pow(r(), 0.7) * (bot - top - 40);
      var tw = 13 + r() * 12, th = 5 + r() * 5;
      bx.fillStyle = '#0C1A26';
      bx.beginPath(); bx.ellipse(tx, ty + th * 0.4, tw * 1.15, th * 0.8, 0, 0, Math.PI * 2); bx.fill();
      var R2 = 100;
      bx.save(); bx.translate(tx, ty); bx.scale(tw / R2, th / R2);
      var g2 = bx.createRadialGradient(-R2 * 0.5, -R2 * 0.55, R2 * 0.03, 0, 0, R2);
      g2.addColorStop(0, '#6E7E84'); g2.addColorStop(0.5, '#2E3E4A'); g2.addColorStop(1, '#14202B');
      bx.fillStyle = g2; bx.beginPath(); bx.arc(0, 0, R2, 0, Math.PI * 2); bx.fill();
      bx.restore();
    }
  }

  /* ---------- THE NEAR GROUND, depth 0.08, the lower third ---------------- */
  /* REBUILT. Rounds one to three drew this band as a field of lit domes over
     dark sockets, one per tussock. Repeated across a field that idiom reads as
     a colony of glowing organisms rather than as muskeg at dusk, and three
     attempts to tune the ramp only moved it between glowing and flat.
     The idiom was the problem, not the values.
     The ground is now a CONTINUOUSLY MODELLED ENGRAVED SURFACE. akengrave
     exists for exactly this, modelled tone with genuine detail everywhere and
     a per region budget, and it is the bench that scored this studio's best
     artwork craft. Hummocks, hollows and seep channels are FORM, carried by
     the lay of the engraving, so there is no discrete creature shaped object
     anywhere in the band and detail is present at every scale by construction. */
  function nearGround(bx) {
    /* the substrate, laid down FIRST so the engraving has something to cut */
    var pg = bx.createLinearGradient(0, HORIZON, 0, H);
    pg.addColorStop(0.00, '#12212F');
    pg.addColorStop(0.45, '#16283C');
    pg.addColorStop(1.00, '#101C2A');
    bx.fillStyle = pg; bx.fillRect(0, HORIZON, W, H - HORIZON);

    /* THE FORM. A genuine two axis field, never separable, because a separable
       form makes every engrave seed land on one iso-line and the whole region
       prints as a single knotted ribbon. Hummock lattice times a channel
       network times a slow kettle depression. */
    /* A GROUND PLANE, not a wall. World depth on a plane seen from 1.5 m goes
       as 1 over the screen distance below the horizon, so BOTH axes of the
       form compress with it. Parameterised in screen space, as the first build
       was, the hummock lattice and the channel network carry the same pitch at
       the horizon and at the frame foot, the near ground reads as an
       unforeshortened sheet, and the whole frame reads as a topographic plate
       rather than as country. That is what the cover's wordless claim failed
       on, and it is a coordinate change, not a texture change. */
    function form(x, y) {
      var d = Math.max(10, y - HORIZON);
      var sc = 250 / d;
      var u = (x - 540) * 0.0060 * sc + 4.0;
      var v = 5.6 * sc;
      var hummock = 30 * AK.fbm2(u * 1.15, v * 1.35, 2);
      var channel = -20 * Math.abs(AK.fbm2(u * 0.62 + 3.7, v * 0.78 + 1.3, 2) - 0.5);
      var kettle  = -30 * Math.exp(-(Math.pow((x - 690) / 300, 2) + Math.pow((y - 1180) / 130, 2)));
      var tilt    = (y - HORIZON) * 0.018;
      return hummock + channel + kettle + tilt;
    }

    /* hachure first, so stroke WIDTH is the local slope of that same form */
    AK.hachureField(bx, {
      x: 0, y: HORIZON, w: W, h: H - HORIZON, scale: 1, seed: SEED + 29,
      height: function (u, v) {
        return 0.5 + 0.5 * Math.tanh(form(u * W, HORIZON + v * (H - HORIZON)) / 40);
      },
      cell: 11, lenScale: 1.8, passes: 4,
      sunAz: 318, sunEl: 9, sunJitter: 12,
      color: '#31506C', alpha: 0.30, minWidth: 0.45, maxWidth: 3.6
    });

    /* THE ENGRAVING. Three gated channels are a per region detail budget
       expressed as a drawing system, which is the whole reason this bench
       exists. seedDeg turns the seeding raster alone. */
    var eng = AKENGRAVE.create({ seed: SEED + 61, light: { azDeg: 318, elDeg: 22 } });
    eng.reserve(AKENGRAVE.boxesFor('[data-reserve]'));
    eng.surface(bx, {
      region: [0, HORIZON + 6, W, H - HORIZON - 6],
      form: form,
      tone: function (x, y) {
        /* darker toward the frame foot, lighter on the hummock crests */
        var t = (y - HORIZON) / (H - HORIZON);
        return Math.max(0.06, Math.min(0.95, 0.30 + 0.42 * t + 0.22 * AK.fbm2(x * 0.004, y * 0.004, 3)));
      },
      budget: { main: 6.4, cross: 8.6, dots: true },
      inkLo: '#1B2E3E', inkHi: '#3E5163', alpha: 0.30,
      seedDeg: 37
    });

    /* sphagnum tooth, the millimetre scale, weighted to the crests */
    AKSTIPPLE.field(bx, {
      seed: SEED + 71, count: 30000, w: W, h: H,
      height: function (x, y) {
        /* the band's upper boundary WANDERS and feathers, because a level
           clip across 1080 px is a ruled line and the ground carries none */
        var edge = HORIZON + 16 + 40 * (AK.fbm2(x * 0.0062, 3.1, 2) - 0.5) * 2;
        if (y < edge) return 0;
        var ramp = Math.min(1, (y - edge) / 44);
        return ramp * Math.max(0, Math.min(1, 0.5 + form(x, y) / 70));
      },
      ramp: ['#1B2C3B', '#263B4A', '#33505E', '#465F6B', '#5E7580', '#7D8C79'],
      radius: function (q) { return 0.8 + 1.1 * q; },
      alpha: function (q) { return 0.16 + 0.34 * q; },
      box: [0, HORIZON, W, H - HORIZON]
    });

    /* THE CENTIMETRE SCALE, and it is a POPULATION OF TWELVE, not a field.
       Rounds one to three drew a dome per tussock across the whole band and it
       read as a colony of glowing organisms, so round four removed them
       entirely and the band lost its cast shadows and its near scale with
       them. Both readings were right. The answer is neither a field nor
       nothing: twelve crowns in the immediate foreground only, at the size
       genuine foreshortening gives them there, each with an ATTACHED cast at
       the key's nine degrees. Sparse and large is a foreground; dense and even
       is a colony. */
    var cr2 = AK.rng(SEED + 83);
    for (var c3 = 0; c3 < 12; c3++) {
      var cx3 = -30 + cr2() * (W + 60);
      var cy3 = 1120 + Math.pow(cr2(), 0.8) * 220;
      var rad = 20 + ((cy3 - 1120) / 220) * 20 * (0.75 + cr2() * 0.5);
      if (AKPARCEL.reserved(cx3, cy3)) continue;
      /* the cast, attached at the crown's own base and thrown southeast */
      bx.save();
      bx.globalAlpha = 0.62; bx.fillStyle = '#050C15';
      bx.translate(cx3 + rad * 0.9, cy3 + rad * 0.20);
      bx.rotate(0.16); bx.scale(1, 0.26);
      bx.beginPath(); bx.arc(0, 0, rad * 1.9, 0, Math.PI * 2); bx.fill();
      bx.restore();
      bx.globalAlpha = 1;
      /* the crown, a modelled cap and NOT a lit dome in a dark socket: the
         value runs from a key lit northwest shoulder into the peat it sits on,
         with no ring of dark around it to make it float */
      bx.save();
      bx.translate(cx3, cy3); bx.scale(1, 0.42);
      var cg3 = bx.createRadialGradient(-rad * 0.42, -rad * 0.46, rad * 0.05, 0, 0, rad);
      cg3.addColorStop(0.00, '#7E8F8A');
      cg3.addColorStop(0.42, '#40584C');
      cg3.addColorStop(0.82, '#1C2E3C');
      cg3.addColorStop(1.00, 'rgba(28,46,60,0)');
      bx.fillStyle = cg3; bx.beginPath(); bx.arc(0, 0, rad, 0, Math.PI * 2); bx.fill();
      bx.restore();
      /* the head's own sedge, the millimetre scale on top of the surface */
      bx.strokeStyle = '#7D8C79'; bx.lineWidth = 0.9;
      for (var bl = 0; bl < 9; bl++) {
        var ba = -Math.PI * 0.92 + (bl / 9) * Math.PI * 1.84;
        bx.globalAlpha = 0.18 + 0.34 * Math.pow(Math.max(0, Math.cos(ba - 2.36)), 2);
        bx.beginPath();
        bx.moveTo(cx3 + Math.cos(ba) * rad * 0.5, cy3 + Math.sin(ba) * rad * 0.24);
        bx.lineTo(cx3 + Math.cos(ba) * rad * 0.95, cy3 - rad * (0.5 + cr2() * 0.55));
        bx.stroke();
      }
      bx.globalAlpha = 1;
    }

    /* ICE FOG, thin, only where the form dips. Modelled upper edge, not a wash. */
    var fr = AK.rng(SEED + 31);
    for (var k = 0; k < 8; k++) {
      var fcx = -40 + fr() * (W + 80);
      var fcy = HORIZON + 90 + Math.pow(fr(), 0.7) * (H - HORIZON - 150);
      if (form(fcx, fcy) > 4) continue;              /* fog sits in hollows only */
      var frx = 120 + fr() * 200, fry = 13 + fr() * 15;
      bx.save();
      bx.globalAlpha = 0.15 + fr() * 0.10;
      bx.translate(fcx, fcy); bx.scale(frx / 100, fry / 100);
      var fg = bx.createRadialGradient(0, 0, 6, 0, 0, 100);
      fg.addColorStop(0.00, '#3A5468'); fg.addColorStop(0.55, '#2A4258');
      fg.addColorStop(1.00, 'rgba(42,66,88,0)');
      bx.fillStyle = fg; bx.beginPath(); bx.arc(0, 0, 100, 0, Math.PI * 2); bx.fill();
      bx.restore();
      bx.globalAlpha = 0.26 + fr() * 0.12;
      bx.strokeStyle = '#4E6C82'; bx.lineWidth = 0.75;
      bx.beginPath();
      for (var ex = -frx; ex <= frx; ex += 9) {
        bx.lineTo(fcx + ex, fcy - fry * 0.8 - 4 * AK.fbm2((fcx + ex) * 0.013, k * 2.3, 3));
      }
      bx.stroke(); bx.globalAlpha = 1;
    }

    /* TWO NEAR BOLES, the frame's scale ladder and the deck's edge tease.
       Silhouettes against the engraved ground, no glow, one lit edge each. */
    [[52, H + 26, 470, -0.10], [1056, H + 6, 560, -0.16]].forEach(function (b, bi) {
      var bxp = b[0], byp = b[1], bh = b[2], lean = b[3], bw = 30 + bi * 10;
      var tipx = bxp + lean * bh;
      bx.fillStyle = '#0B1A18';
      bx.beginPath();
      bx.moveTo(bxp - bw * 0.5, byp); bx.lineTo(tipx, byp - bh);
      bx.lineTo(bxp + bw * 0.5, byp); bx.closePath(); bx.fill();
      /* a black spruce is a dense club of whorls over a bare lower stem, and
         drawing that difference is what makes it read as black spruce rather
         than as a stack of beads. Whorls only above 45 percent of height. */
      for (var k2 = 0; k2 < 22; k2++) {
        var t2 = 0.45 + (k2 / 22) * 0.52;
        var ww = bw * (1.45 - t2 * 1.05) * (0.86 + 0.28 * ((k2 % 3) / 2));
        bx.fillStyle = (k2 % 2 === 0) ? '#162D27' : '#0B1A18';
        bx.beginPath();
        bx.moveTo(bxp + lean * bh * t2 - ww, byp - bh * t2);
        bx.quadraticCurveTo(bxp + lean * bh * t2, byp - bh * t2 - ww * 0.34,
                            bxp + lean * bh * t2 + ww, byp - bh * t2);
        bx.quadraticCurveTo(bxp + lean * bh * t2, byp - bh * t2 + ww * 0.20,
                            bxp + lean * bh * t2 - ww, byp - bh * t2);
        bx.fill();
      }
      bx.strokeStyle = '#3C5C46'; bx.lineWidth = 1.25; bx.globalAlpha = 0.55;
      bx.beginPath();
      bx.moveTo(bxp - bw * 0.44, byp - bh * 0.04);
      bx.lineTo(tipx - bw * 0.12, byp - bh * 0.92);
      bx.stroke(); bx.globalAlpha = 1;
    });
  }

  /* ---------- compose, far to near, each band attenuated ONCE ------------- */
  sky();
  AKPARCEL.band(cx, { draw: treeLine,  depth: 0.92, sky: FAR, w: W, h: H });
  AKPARCEL.band(cx, { draw: midSpruce, depth: 0.60, sky: FAR, w: W, h: H, blur: 0.6 });
  AKPARCEL.band(cx, { draw: midScrub,  depth: 0.45, sky: FAR, w: W, h: H });
  AKPARCEL.band(cx, { draw: nearGround, depth: 0.08, sky: FAR, w: W, h: H });

  /* ---------- THE PAPER GEOMETRY, 0.1 percent of the frame ---------------- */
  /* One tick, cut by the right edge. The document exists and is barely
     present. It is the only straight line in this frame. */
  cx.save();
  AKPARCEL.stroke(cx, 'solid', '#E8EEF5');
  cx.lineWidth = 1.25;
  cx.beginPath(); cx.moveTo(1062, 742); cx.lineTo(1080, 742); cx.stroke();
  cx.beginPath(); cx.moveTo(1062, 736); cx.lineTo(1062, 748); cx.stroke();
  cx.restore();

  /* ---------- the film grade, once, on the art canvas --------------------- */
  AKPOST.grade(cx, {
    w: W, h: H,
    exposure: -0.06, saturation: 1.05, contrast: 1.10, filmic: true,
    lift: [0.010, 0.014, 0.024], gain: [1.015, 1.0, 0.975],
    vignette: 0.18, bloom: { threshold: 0.76, strength: 0.24, radius: 8 },
    grain: { amount: 0.045, size: 2, seed: SEED }, dither: true, sharpen: 0.30
  });

  /* grain tile, never a full frame turbulence rect */
  document.getElementById('grain').style.backgroundImage =
    'url(' + AK.grainTile(280, 52, SEED + 5) + ')';

  resolve();
  })().catch(function (e) {
    console.error('SLIDE 01 FAILED', e && (e.stack || e.message || e));
    resolve();
  });
});
</script>
