<body data-contacts='[{"what":"the chute on the lake bed","shadow":[[300,1116,80,40]],"ground":[[640,1058,80,40]]}]' data-encodes='[{"claim":"every fish passes one lit gate, one at a time","a":[[188,612,96,108]],"b":[[760,240,180,180]]}]'>

<div class="lyr">

  <div id="h1" class="hl" style="position:absolute;left:80px;top:168px;width:920px;font-size:132px">"The system<br>is not broken.<br>That's the problem."</div>
  <div class="bd" style="position:absolute;left:80px;top:604px;width:270px;font-size:25px;font-variation-settings:'wdth' 62,'wght' 500;letter-spacing:.02em;line-height:1.42">Jeff Feldpausch, Sitka Tribe of Alaska, to KCAW, August 5th, 2026</div>

<script>
/* THE REDOUBT CHUTE WORLD - metres, +Y up, +Z upstream. Shared by 01/05/06 only. */
var S = AKSDF; S.reseed(20260808);
function scene(p){
  var best, mat;
  var db = S.sdBox(S.sub(p,[0,-0.05,0]),[7,0.05,9]);
  if (db < 0.14) db += S.fbm3(p[0]*1.6, 0.5, p[2]*1.6, 3)*0.030;
  best = db; mat = 1;
  var co = S.sdBox(S.sub(p,[0,0.45,1.20]),[0.31,0.35,1.20]);
  var ci = S.sdBox(S.sub(p,[0,0.45,1.24]),[0.21,0.25,1.34]);
  var chute = S.opSub(co, ci);
  if (chute < best){ best = chute; mat = 2; }
  var plug = S.sdBox(S.sub(p,[0,0.45,0.16]),[0.205,0.245,0.02]);
  if (plug < best){ best = plug; mat = 3; }
  var cam = S.sdCapsule(p,[0.34,0.62,0.46],[0.34,0.62,0.64],0.048);
  if (cam < best){ best = cam; mat = 4; }
  var q = S.sub(p,[0.02,0.45,0.86]);
  var body = S.sdCapsule(q,[0,0,-0.19],[0,0,0.17],0.052);
  var head = S.sdSphere(S.sub(q,[0,-0.005,0.23]),0.049);
  var hump = S.sdSphere(S.sub(q,[0,0.052,-0.03]),0.045);
  var tail = S.sdRoundBox(S.sub(q,[0,0,-0.275]),[0.004,0.052,0.042],0.010);
  var fish = S.smin(S.smin(body,head,0.055), S.smin(hump,tail,0.09), 0.055);
  if (fish < best){ best = fish; mat = 5; }
  var rp = S.opRepXZ(p, 0.235, 400);
  var pick = S.sdBox(S.sub(rp,[0,0.50,-1.25]),[0.026,0.50,0.026]);
  var bnd = S.sdBox(S.sub(p,[0,0.50,-1.25]),[2.40,0.50,0.06]);
  var pk = S.opSub(S.opInter(pick, bnd), S.sdBox(S.sub(p,[0,0.45,-1.25]),[0.40,0.62,0.40]));
  if (pk < best){ best = pk; mat = 6; }
  return [best, mat];
}

function atmos(cx, seed, fogTop, fogBot, dz){
  var g = cx.createLinearGradient(0,0,0,1350);
  g.addColorStop(0, fogTop); g.addColorStop(0.62, fogBot); g.addColorStop(1, '#04080D');
  cx.fillStyle = g; cx.fillRect(0,0,1080,1350);
  var r = AK.rng(seed);
  for (var i=0;i<220;i++){                 // silt motes, near field
    var x = r()*1080, y = 200 + r()*1150, s = 0.5 + r()*1.9;
    cx.globalAlpha = 0.05 + r()*0.10;
    cx.fillStyle = '#8FA36A';
    cx.beginPath(); cx.arc(x,y,s,0,6.2832); cx.fill();
  }
  cx.globalAlpha = 1;
}
function grain(cx, seed){
  var t = document.createElement('canvas'); t.width = 96; t.height = 96;
  var tc = t.getContext('2d'), id = tc.createImageData(96,96), r = AK.rng(seed);
  for (var i=0;i<96*96;i++){
    var v = 118 + (r()*74 - 37);
    id.data[i*4]=v; id.data[i*4+1]=v; id.data[i*4+2]=v; id.data[i*4+3]=17;
  }
  tc.putImageData(id,0,0);
  var pat = cx.createPattern(t,'repeat');
  cx.globalCompositeOperation = 'overlay';
  cx.fillStyle = pat; cx.fillRect(0,0,1080,1350);
  cx.globalCompositeOperation = 'source-over';
}
function shafts(cx, n, alpha, ox, oy, spread, seed){
  var r = AK.rng(seed);
  cx.save(); cx.globalCompositeOperation = 'screen';
  for (var i=0;i<n;i++){
    var a = -1.9 + (i/(n-1||1))*spread + (r()-0.5)*0.05;
    var w = 26 + r()*40, L = 900 + r()*420;
    cx.save(); cx.translate(ox,oy); cx.rotate(a);
    var g = cx.createLinearGradient(0,0,0,-L);
    g.addColorStop(0,'rgba(192,138,62,'+alpha+')');
    g.addColorStop(1,'rgba(192,138,62,0)');
    cx.fillStyle = g;
    cx.beginPath(); cx.moveTo(-w*0.30,0); cx.lineTo(w*0.30,0);
    cx.lineTo(w*1.5,-L); cx.lineTo(-w*1.5,-L); cx.closePath(); cx.fill();
    cx.restore();
  }
  cx.restore();
}

function rayFrame(cx, opts){
  var r = AKSDF.render(cx, {
    scene: scene, width: opts.w, height: opts.h, box:[0,0,1080,1350],
    cam: opts.cam, light: [-0.34,0.86,0.38],
    mats: {
      1:{color:[0.013*opts.g,0.022*opts.g,0.019*opts.g], spec:0.05},
      2:{color:[0.17*opts.g,0.18*opts.g,0.172*opts.g], spec:0.20,
         emissive:[0.085*opts.e,0.079*opts.e,0.064*opts.e]},
      3:{color:[0.02,0.02,0.02], spec:0.0,
         emissive:[2.60*opts.e,2.16*opts.e,1.48*opts.e]},
      4:{color:[0.014*opts.g,0.020*opts.g,0.018*opts.g], spec:0.40},
      5:{color:[0.013*opts.g,0.019*opts.g,0.017*opts.g], spec:0.50},
      6:{color:[0.012*opts.g,0.017*opts.g,0.015*opts.g], spec:0.10}
    },
    sky:[0.006,0.013,0.015], fog:0.135,
    keyColor:[1.00,0.92,0.76], shadowColor:[0.055,0.095,0.085],
    seed: 20260808, deadlineMs: 12000, maxSteps: 96, eps: 0.0015
  });
  window.__akHero = {rung:'aksdf', scene:'redoubt-chute', internal:[opts.w,opts.h],
                     primitives:9, shadows:r.shadows, ao:r.ao,
                     degraded:!(r.shadows && r.ao)};
  return r;
}
function probe(cx, rect){                 // median L* of a region, feed scale
  var d = cx.getImageData(rect[0]*2, rect[1]*2, rect[2]*2, rect[3]*2).data, v=[];
  for (var i=0;i<d.length;i+=16){
    var R=d[i]/255,G=d[i+1]/255,B=d[i+2]/255;
    var Y=0.2126*R+0.7152*G+0.0722*B;
    v.push(Y<=0.008856?903.3*Y:116*Math.pow(Y,1/3)-16);
  }
  v.sort(function(a,b){return a-b;});
  return Math.round(v[Math.floor(v.length/2)]*10)/10;
}


/* THE COVER'S OWN FOREGROUND. None of this exists on any other slide: a blurred
   near-field picket pair and a half-seen sockeye bleeding off the bottom-left,
   plus a surface shimmer band and a hand-built vignette. This is the
   instant-expensive-lens repoussoir the cover needs and the hero frames do not. */
function coverForeground(cx){
  cx.save(); cx.filter='blur(26px)';
  var g1=cx.createLinearGradient(0,700,300,1350);
  g1.addColorStop(0,'#0D1815'); g1.addColorStop(1,'#050B09');
  cx.fillStyle=g1;
  cx.beginPath(); cx.moveTo(-40,624); cx.lineTo(126,596); cx.lineTo(168,1350);
  cx.lineTo(-40,1350); cx.closePath(); cx.fill();
  cx.beginPath(); cx.moveTo(206,668); cx.lineTo(300,656); cx.lineTo(338,1350);
  cx.lineTo(232,1350); cx.closePath(); cx.fill();
  cx.restore(); cx.filter='none';
  // a sockeye half out of frame at the bottom left, softened by the near water
  cx.save(); cx.filter='blur(15px)'; cx.translate(1006,1180); cx.rotate(-0.16);
  cx.fillStyle='#0A100E';
  cx.beginPath();
  cx.moveTo(-330,0); cx.quadraticCurveTo(-160,-84,80,-62);
  cx.quadraticCurveTo(268,-42,352,4); cx.quadraticCurveTo(268,50,80,66);
  cx.quadraticCurveTo(-160,86,-330,0); cx.closePath(); cx.fill();
  cx.beginPath(); cx.moveTo(-330,0); cx.lineTo(-424,-70); cx.lineTo(-398,0);
  cx.lineTo(-424,70); cx.closePath(); cx.fill();
  cx.restore(); cx.filter='none';
  // the lake surface far above, a thin shimmer band the hero frames never show
  AK.reseed(20260808+11);
  cx.save(); cx.globalCompositeOperation='screen';
  for(var i=0;i<70;i++){
    var y=96+AK.fbm2(i*0.31,0.7,3)*54, w=40+((i*29)%120), x=(i*17.4)%1080;
    cx.fillStyle='rgba(160,190,140,'+(0.020+((i%5)*0.006)).toFixed(3)+')';
    cx.fillRect(x,y,w,2.4);
  }
  cx.restore();
  // a hand-built vignette so the cover reads as one focal object at 432px
  var vg=cx.createRadialGradient(300,830,180,300,830,940);
  vg.addColorStop(0,'rgba(4,8,13,0)'); vg.addColorStop(1,'rgba(4,8,13,0.72)');
  cx.fillStyle=vg; cx.fillRect(0,0,1080,1350);
}
function draw(){
  var cx = document.getElementById('art').getContext('2d');
  cx.setTransform(2,0,0,2,0,0);
  atmos(cx, 20260808+1, '#0A1614', '#08110F', 0.16);
  AKPOST.grade(cx, {exposure:1.02, saturation:0.95, contrast:1.06});
  rayFrame(cx, {w:440,h:660,g:1.0,e:1.0,
                cam:{pos:[0.55,0.90,-2.40], look:[-0.22,0.34,0.44], fov:58}});

  shafts(cx, 4, 0.08, 300, 940, 0.55, 20260808+1);
  coverForeground(cx);
  grain(cx, 20260808+1);
  window.__akProbes = {
    slot_core: probe(cx,[188,612,96,108]),
    wall_shadow: probe(cx,[430,760,90,90]),
    open_water: probe(cx,[760,240,180,180])
  };
}
window.__fit = function(){ AK.fitText(document.getElementById('h1'),{min:120,max:156,maxLines:3}); };

</script>

<script>
window.renderReady = new Promise(function(res){
  (async function(){
    await document.fonts.ready;
    draw();
    if (window.__fit) window.__fit();
    res();
  })();
});
</script>
