<h1 class="hd" id="h1" style="left:80px;top:118px;width:860px;font-size:132px">ONE NOTICE ASKS ABOUT AI. THE OTHER COUNTS ALASKA. SAME DAY.</h1>
<div class="mn" id="k1" style="left:80px;top:620px">FEDERAL REGISTER VOL 91 NO 167 . AUGUST 31, 2026 (C01, C04)</div>

<script>
var CV=document.getElementById('art'), CX=CV.getContext('2d');
CX.scale(2,2);
var V='#03070E',D='#0A1420',CL='#16303A',CK='#24505C',OX='#6E2A22',PA='#C9BFA8',
    FM='#6EA5FF',SN='#F4F8FF',GD='#FFC72C',GH='#FFDA6E',RU='#3E5468';
AK.reseed(20260832);
var RND=AK.rng(20260832);
function nrm(r){var u=1-r(),v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185307*v);}
/* HOUSE FIXTURE. The accession rule, the deck's panorama spine. Ticks after the
   current slide are never drawn, because this deck may not write the future. */
var RULE_DATES=['1997','2019','FY2024','FY2025','AUG 6','AUG 7','AUG 31','SEP 30','OCT 30'];
function accession(cx,n){
  var y=1214, x0=80, x1=1000, span=x1-x0;
  var gg=cx.createLinearGradient(x0,y-8,x1,y+8);
  gg.addColorStop(0,'#2A3D4E'); gg.addColorStop(.34,'#6B5A2E'); gg.addColorStop(1,'#1B2A38');
  cx.strokeStyle=gg; cx.lineWidth=3; cx.lineCap='butt';
  var cut=x0+span*((n-0.5)/9);
  cx.beginPath(); cx.moveTo(x0,y); cx.lineTo(cut,y); cx.stroke();
  cx.strokeStyle='#26313C'; cx.lineWidth=1.5;
  cx.beginPath(); cx.moveTo(cut,y); cx.lineTo(cut+34,y-9); cx.stroke();
  for(var i=0;i<n;i++){
    var tx=x0+span*((i+0.5)/9), last=(i===n-1);
    cx.strokeStyle=last?GD:RU; cx.lineWidth=last?2.2:1.2;
    cx.beginPath(); cx.moveTo(tx,y-11); cx.lineTo(tx,y+ (last?13:8)); cx.stroke();
    if(last){cx.fillStyle=GD; cx.beginPath(); cx.arc(tx,y-15,2.4,0,6.2832); cx.fill();}
  }
}
function grain(cx,a){
  var g=cx.createRadialGradient(540,1000,10,540,1000,900);
  g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(1,'rgba(0,0,0,'+a+')');
  cx.fillStyle=g; cx.beginPath(); cx.arc(540,1000,900,0,6.2832); cx.fill();
}
var GRADE={w:1080,h:1350,exposure:-0.04,saturation:1.02,contrast:1.08,filmic:true,
  lift:[0.010,0.014,0.024],gain:[1.015,1.0,0.975],vignette:0.18,
  bloom:{threshold:0.74,strength:0.12,radius:14},
  grain:{amount:0.055,size:2,seed:20260832},aberration:0,dither:true,sharpen:0.32};
</script>
<script>
/* THE TYPE RESERVE. Measured off the laid-out DOM, never guessed, and applied as
   a clip so the art never generates a mark under a glyph in the first place.
   featherReserve() then softens the LARGE plates only. See build.py's own notes. */
var RESB=[];
function measureReserve(){
  RESB=[];
  var els=document.querySelectorAll('.hd,.qt,.bd,.sub,.mn,.sm,.tag,.ct,.rl');
  for(var i=0;i<els.length;i++){
    var r=els[i].getBoundingClientRect();
    if(r.width<2||r.height<2) continue;
    RESB.push([r.left-12, r.top-8, r.width+24, r.height+16]);
  }
}
function flow(pairs){
  var prev=null;
  for(var i=0;i<pairs.length;i++){
    var el=document.getElementById(pairs[i][0]); if(!el) continue;
    if(prev){
      var r=prev.getBoundingClientRect();
      el.style.top=Math.round(r.bottom+pairs[i][1])+'px';
    }
    prev=el;
  }
}
function ground(cx){
  var g=cx.createLinearGradient(240,0,940,1350);
  g.addColorStop(0,'#050B14'); g.addColorStop(.46,'#0B1A28'); g.addColorStop(1,'#04080F');
  cx.fillStyle=g; cx.fillRect(0,0,1080,1350);
  cx.save(); cx.translate(560,1010); cx.scale(1.35,0.52);
  var h=cx.createRadialGradient(0,0,20,0,0,760);
  h.addColorStop(0,'#16303F'); h.addColorStop(.55,'#0C1B27'); h.addColorStop(1,'rgba(4,8,15,0)');
  cx.fillStyle=h; cx.beginPath(); cx.arc(0,0,760,0,6.2832); cx.fill(); cx.restore();
}
function RES(fn){
  CX.save();
  CX.beginPath();
  CX.rect(0,0,1080,1350);
  for(var i=0;i<RESB.length;i++){
    var b=RESB[i];
    CX.moveTo(b[0],b[1]); CX.lineTo(b[0],b[1]+b[3]);
    CX.lineTo(b[0]+b[2],b[1]+b[3]); CX.lineTo(b[0]+b[2],b[1]); CX.closePath();
  }
  CX.clip('evenodd');
  fn();
  CX.restore();
  featherReserve();
}
function featherReserve(){
  if(!RESB.length) return;
  CX.save();
  CX.fillStyle='rgba(7,15,24,0.74)';
  for(var i=0;i<RESB.length;i++){
    var b=RESB[i];
    if(b[3]<64) continue;
    var r=Math.min(20,b[3]/5);
    CX.filter='blur('+r.toFixed(1)+'px)';
    CX.fillRect(b[0]+r*0.6,b[1]+r*0.5,b[2]-r*1.2,b[3]-r);
  }
  CX.restore();
}
window.renderReady=(async function(){
await document.fonts.ready;

AK.fitText(document.getElementById('h1'),{min:72,max:132,maxLines:4});


flow([['h1',0],['k1',56]]);

measureReserve();

// GROUND. recess behind, then the brass ledge as a lit pool cast in a transform.
ground(CX);
var rg=CX.createLinearGradient(0,600,0,1060);
rg.addColorStop(0,V); rg.addColorStop(1,D); CX.fillStyle=rg; CX.fillRect(0,600,1080,460);
CX.save(); CX.translate(560,1078); CX.scale(1.0,0.20);
var pool=CX.createRadialGradient(0,0,20,0,0,620);
pool.addColorStop(0,'#33606E'); pool.addColorStop(.55,'#20414F'); pool.addColorStop(1,D);
CX.fillStyle=pool; CX.beginPath(); CX.arc(0,0,620,0,6.2832); CX.fill(); CX.restore();
// ledge nose, one gold specular edge across the frame
CX.strokeStyle=GD; CX.lineWidth=3.4; CX.globalAlpha=.85;
CX.beginPath(); CX.moveTo(0,1096); CX.quadraticCurveTo(540,1092,1080,1097); CX.stroke();
CX.globalAlpha=1;

RES(function(){

// ONE UNSEWN BLOCK. a squared stack of loose leaves, drawn leaf by leaf.
function block(bx,by,bw,nl,lean,scale){
  var lh=1.9*scale, depth=54*scale;
  // cast shadow first, into the lit pool, attached with zero gap
  CX.save(); CX.translate(bx+bw*0.5,by+2); CX.scale(1.0,0.19);
  var sh=CX.createRadialGradient(0,0,6,0,0,bw*0.92);
  sh.addColorStop(0,'rgba(7,16,25,0.80)'); sh.addColorStop(.5,'rgba(7,16,25,0.34)');
  sh.addColorStop(1,'rgba(7,16,25,0)');
  CX.fillStyle=sh; CX.beginPath(); CX.arc(0,0,bw*0.92,0,6.2832); CX.fill(); CX.restore();
  // cabinet top face
  CX.beginPath(); CX.moveTo(bx,by-nl*lh); CX.lineTo(bx+depth*0.62,by-nl*lh-depth*0.48);
  CX.lineTo(bx+bw+depth*0.62,by-nl*lh-depth*0.48); CX.lineTo(bx+bw,by-nl*lh); CX.closePath();
  CX.fillStyle='#8C8878'; CX.fill();
  // the leaves, each a slightly wandering edge
  for(var i=0;i<nl;i++){
    var t=i/nl, y=by-i*lh;
    var w1=0.34+0.66*Math.abs(AK.fbm2(i*0.09, 4.2, {octaves:3}));
    var lit=0.30+0.58*w1*(1-0.35*t);
    CX.strokeStyle='rgba('+Math.round(201*lit+18)+','+Math.round(191*lit+20)+','+Math.round(168*lit+24)+',1)';
    CX.lineWidth=lh*0.92;
    CX.beginPath(); CX.moveTo(bx,y);
    CX.quadraticCurveTo(bx+bw*0.5, y+nrm(RND)*0.55, bx+bw, y+lean*t);
    CX.stroke();
  }
  // the five sewing stations, pierced, unthreaded
  for(var s=0;s<5;s++){
    var sy=by-nl*lh*(0.16+0.17*s);
    CX.fillStyle='#050C14'; CX.beginPath(); CX.arc(bx+bw*0.5, sy, 3.6*scale, 0, 6.2832); CX.fill();
    CX.strokeStyle='rgba(180,170,150,0.42)'; CX.lineWidth=1;
    CX.beginPath(); CX.arc(bx+bw*0.5-0.6, sy-0.6, 3.6*scale, 3.4, 5.6); CX.stroke();
  }
}
block(150, 1090, 300, 128, 3.0, 1.0);
block(842, 1090, 300, 118, -2.4, 0.94);   // bleeds off the right edge, the swipe cue
// the loose gold thread lying unthreaded on the ledge
CX.strokeStyle=GD; CX.lineWidth=1.8; CX.globalAlpha=.9;
CX.beginPath(); CX.moveTo(470,1082);
CX.bezierCurveTo(520,1070,560,1094,604,1078); CX.stroke(); CX.globalAlpha=1;
accession(CX,1);

});

grain(CX,0.22);

AKPOST.grade(CX,GRADE);

window.__akMotifs=[{what:'the 2026 slot, dark between the two blocks',rect:[452,900,164,190]}];

})();
</script></body></html>
