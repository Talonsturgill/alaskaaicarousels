<script>
/* ---- THE STATION LINE, solved once in the storyboard header and used here ---- */
var F=2208, CXP=540, HZ=470, CAMH=0.72;
function GY(Z){ return HZ + F*(CAMH/Z); }                 // ground y at depth Z
function TY(Z,h){ return HZ + F*((CAMH-h)/Z); }           // y of a point h above the ground
function SX(X,Z){ return CXP + F*(X/Z); }                 // screen x of world X at depth Z
function WX(x,Z){ return (x-CXP)*Z/F; }                   // world X of screen x at depth Z
var ZR=3.70, MH=0.45, ROD=0.014;
/* THE DOUBLED STATION HAS TO SURVIVE THE THUMB, which is the cover's one job.
   At a 0.030 m lateral offset the pair drew 21 px apart, so at 432 px the
   doubled station was four pixels wide against a three pixel neighbour and the
   hook was inside the noise. Two changes, both legal: the deck header declares
   x on this row is NOT a measured axis and the row carries no data-scale, so
   local spacing is free. The twin closes to 14 px, which makes the doubled
   station read as ONE mark two and a half times wider than any other at feed
   size and still as two rods with clear sky between them at full size. Then
   stations 14 through 21 and the whole federal block step right by 24 px, so
   the gap AFTER the pair opens to 41 px against a 31.5 px pitch and the picket
   fence breaks where the argument is. The count is unchanged at 25 and the
   96 px state-to-federal separator is untouched, both blocks having moved by
   the same amount. */
var STATE=[], FED=[], SHIFT=24;
for (var i=0;i<21;i++) STATE.push(96+31.5*i + (i>=13?SHIFT:0));
for (var j=0;j<4;j++)  FED.push(822+31.5*j + SHIFT);
var TWIN_Z=3.95, TWIN_X=WX(474,ZR)+0.0176;

/* the sun, azimuth +4 deg off the optical axis, elevation 14 deg */
var SUNX=0.06769, SUNY=0.24192, SUNZ=0.96793;
var TSH=MH/SUNY;                                           // 1.8601 m to the ground
function shadowTip(X,Z){ var z2=Z-SUNZ*TSH; return [SX(X-SUNX*TSH,z2), GY(z2)]; }

var V='#050A12', LID='#0E1A28', FAR='#20313A', LIT='#33402F', NEAR='#0D1418',
    STL='#9AA7AE', SPC='#D7E2E8', SNOW='#F4F8FF', GOLD='#FFC72C', FMN='#6EA5FF';
var CV=document.getElementById('art'), CX=CV.getContext('2d');
CX.scale(2,2);
AK.reseed(20260901);
var RND=AK.rng(20260901+1);

var GRADE={w:1080,h:1350,exposure:-0.08,saturation:1.02,contrast:1.06,filmic:true,
  lift:[0.006,0.010,0.018],gain:[1.012,1.0,0.984],vignette:0.16,
  bloom:{threshold:0.78,strength:0.10,radius:12},
  grain:{amount:0.050,size:2,seed:20260901},aberration:0,dither:true,sharpen:0.30};
</script>
<script type="module">
/* ================= SLIDE 01, THE COVER =================
   The whole row at the establishing stance. Twenty five stations, one of them
   carrying two markers. The shadows those markers throw toward the reader are
   the type reserve, so the art is COMPOSED to stop at y 940 rather than clipped
   after the fact. Nothing below that line is drawn except the graded field, the
   fog, the grain and one leader hairline.
   ======================================================= */
const A='@@ASSETS@@';

/* ---- the ground, drawn before anything stands on it ---- */
function sky(){
  var g=CX.createLinearGradient(0,0,0,HZ+40);
  g.addColorStop(0,V); g.addColorStop(.62,'#091320'); g.addColorStop(1,LID);
  CX.fillStyle=g; CX.fillRect(0,0,1080,HZ+40);
  /* the lid itself. A high overcast is not an empty sky, it has strata, and
     without them the upper third is a black rectangle rather than weather. */
  for(var c=0;c<7;c++){
    var r=AK.rng(51700+c);
    var y=96+c*54+r()*26, hh=16+22*r(), a=0.030+0.034*r();
    var cg=CX.createLinearGradient(0,y,0,y+hh);
    cg.addColorStop(0,'rgba(126,151,174,0)');
    cg.addColorStop(.5,'rgba(126,151,174,'+a.toFixed(3)+')');
    cg.addColorStop(1,'rgba(126,151,174,0)');
    CX.fillStyle=cg;
    CX.beginPath();
    CX.moveTo(-40,y+hh*0.5);
    CX.bezierCurveTo(280,y+hh*(0.1+0.5*r()),760,y+hh*(0.9-0.4*r()),1120,y+hh*0.5);
    CX.lineTo(1120,y+hh); CX.lineTo(-40,y+hh); CX.closePath(); CX.fill();
  }
}
/* THE SUN IS LAID AFTER THE GROUND. Painted into the sky its glow was cut off
   square at y 470 by the ground fill, which put a one pixel horizontal step
   across the right quarter of the brightest part of the frame. */
function bloom(){
  CX.save(); CX.globalCompositeOperation='screen';
  CX.translate(1012,452); CX.scale(1.0,0.62);
  var b=CX.createRadialGradient(0,0,6,0,0,190);
  b.addColorStop(0,'rgba(240,192,137,0.30)'); b.addColorStop(.45,'rgba(224,165,102,0.11)');
  b.addColorStop(1,'rgba(224,165,102,0)');
  CX.fillStyle=b; CX.beginPath(); CX.arc(0,0,190,0,6.2832); CX.fill(); CX.restore();
}
/* the dither pass over the lid, in device pixels, because putImageData ignores
   the transform. Ten horizontal seams across the sky are quantisation, not
   strata, and this is the remedy doctrine already names. */
function skyDither(){
  var d=CX.getImageData(0,0,2160,950), a=d.data;
  for(var y=0;y<950;y++){
    for(var x=0;x<2160;x++){
      var n=((x*0.06711056+y*0.00583715)%1)*52.9829189;
      var v=((n-Math.floor(n))-0.5)*3.0;
      var i=(y*2160+x)*4;
      a[i]+=v; a[i+1]+=v; a[i+2]+=v;
    }
  }
  CX.putImageData(d,0,0);
}
function farStand(){
  /* black spruce as a value note only. Density 2 means few, large, good marks. */
  for(var k=0;k<46;k++){
    var r=AK.rng(31400+k), t=r(), x=-30+t*1160, h=26+34*r(), w=5+5*r();
    var a=0.34+0.30*r();
    CX.fillStyle='rgba(28,42,44,'+a.toFixed(3)+')';
    CX.beginPath(); CX.moveTo(x,HZ+2); CX.lineTo(x+w*0.5,HZ+2-h); CX.lineTo(x+w,HZ+2);
    CX.closePath(); CX.fill();
  }
}
function ground(){
  /* ONE continuous field from the horizon to the bottom edge. There is no seam
     at the row, because a seam there would be a fill boundary pretending to be
     a light boundary. What darkens the near ground is the shadow field. */
  var g=CX.createLinearGradient(0,HZ,0,1350);
  g.addColorStop(0,'#16232e'); g.addColorStop(.10,'#1d2b30');
  g.addColorStop(.34,'#2a3630'); g.addColorStop(.58,'#232e2a');
  g.addColorStop(1,NEAR);
  CX.fillStyle=g; CX.fillRect(0,HZ,1080,1350-HZ);
  /* exp2 fog toward the horizon, in the lid's own hue, never gray */
  var f=CX.createLinearGradient(0,HZ,0,HZ+210);
  f.addColorStop(0,'rgba(14,26,40,0.98)'); f.addColorStop(1,'rgba(14,26,40,0)');
  CX.fillStyle=f; CX.fillRect(0,HZ-14,1080,224);
}
function tussock(){
  /* Density 2. Few, large, well modelled marks, spent only in the lit band
     between the horizon and the row, which is where the eye lands. Each crown
     is a lit cap over its own small cast, so the ground reads as modelled tone
     and not as a fill. */
  for(var k=0;k<74;k++){
    var r=AK.rng(90210+k);
    var t=r();
    var Z=1.55+ (ZR+2.6-1.55)*Math.pow(t,0.42);      // more of them further off
    var X=(r()*2-1)*(0.95*Z/ZR+0.55);
    var x=SX(X,Z), y=GY(Z);
    if(x<-70||x>1150) continue;
    /* THE RESERVE IS THE RESERVE. This slide's own standard says nothing below
       y 940 is drawn except the graded field, the fog, the grain and one
       hairline, and the near end of this run was putting modelled crowns
       directly under the display block. */
    if(y>1000) continue;
    var fade=Math.max(0,Math.min(1,(1000-y)/60));
    var w=F*(0.075+0.115*r())/Z, h=w*(0.16+0.12*r());
    var lit=Math.max(0,Math.min(1,(Z-1.4)/3.4));
    CX.save(); CX.globalAlpha=fade;
    CX.save(); CX.translate(x,y); CX.scale(1,0.42);
    var cg=CX.createRadialGradient(0,0,1,0,0,w*0.72);
    cg.addColorStop(0,'rgba(6,12,20,'+(0.20*lit+0.07).toFixed(3)+')');
    cg.addColorStop(1,'rgba(6,12,20,0)');
    CX.fillStyle=cg; CX.beginPath(); CX.arc(0,0,w*0.72,0,6.2832); CX.fill(); CX.restore();
    var cap=CX.createLinearGradient(x,y-h,x,y);
    cap.addColorStop(0,AKC.mixOklab('#2a3630','#5d6552',0.16+0.24*lit));
    cap.addColorStop(1,AKC.mixOklab('#2a3630','#141c20',0.42));
    CX.fillStyle=cap;
    CX.beginPath(); CX.ellipse(x,y-h*0.42,w*0.5,h*0.62,0,0,6.2832); CX.fill();
    CX.restore();
  }
}
/* ---- THE SHADOW FIELD. This is the reserve, and it is optics, not a plate. ----
   Each marker's cast shadow is a tapered quad from its base to its solved tip.
   The focal plane is the row at 3.70 m; the ground under the type is at 1.90 m
   and nearer, so it is genuinely out of the depth of field. The field is drawn
   sharp once on an offscreen and composited in three bands at rising blur, which
   is what makes twenty six hard bands become one graded ground by y 1040. */
function shadowField(){
  var off=document.createElement('canvas'); off.width=2160; off.height=2700;
  var o=off.getContext('2d'); o.scale(2,2);
  function cast(x,Z,alpha){
    var X=WX(x,Z), tip=shadowTip(X,Z);
    var wb=F*ROD/Z, wt=F*ROD/(Z-SUNZ*TSH);
    var g=o.createLinearGradient(x,GY(Z),tip[0],tip[1]);
    g.addColorStop(0,'rgba(5,10,18,'+(0.92*alpha).toFixed(3)+')');
    g.addColorStop(.42,'rgba(5,10,18,'+(0.62*alpha).toFixed(3)+')');
    g.addColorStop(1,'rgba(5,10,18,0)');
    o.fillStyle=g;
    o.beginPath();
    o.moveTo(x-wb/2,GY(Z)); o.lineTo(x+wb/2,GY(Z));
    o.lineTo(tip[0]+wt/2,tip[1]); o.lineTo(tip[0]-wt/2,tip[1]);
    o.closePath(); o.fill();
  }
  STATE.forEach(function(x){ cast(x,ZR,1); });
  FED.forEach(function(x){ cast(x,ZR,1); });
  cast(SX(TWIN_X,TWIN_Z),TWIN_Z,0.86);          // the twin's own, shorter, offset
  /* the first band starts at the TWIN's base, not the row's, or the top 26 px
     of the twin's own cast is clipped away on the one station where a second
     shadow is the entire point. */
  var bands=[[868,962,0],[962,1046,8],[1046,1350,17]];
  bands.forEach(function(b){
    CX.save(); CX.beginPath(); CX.rect(0,b[0],1080,b[1]-b[0]); CX.clip();
    CX.filter=b[2]?('blur('+b[2]+'px)'):'none';
    CX.drawImage(off,0,0,2160,2700,0,0,1080,1350);
    CX.restore();
  });
  CX.filter='none';
}
function fogPools(){
  [[300,1180,300,52],[830,1240,250,44]].forEach(function(p){
    CX.save(); CX.translate(p[0],p[1]); CX.scale(1,p[3]/p[2]);
    var g=CX.createRadialGradient(0,0,4,0,0,p[2]);
    g.addColorStop(0,'rgba(122,150,178,0.085)'); g.addColorStop(1,'rgba(122,150,178,0)');
    CX.fillStyle=g; CX.beginPath(); CX.arc(0,0,p[2],0,6.2832); CX.fill(); CX.restore();
  });
}
/* the lit pool the contact shadows subtract from, built FIRST and cast into */
function litPools(){
  var pts=[[474,900,54],[495,872,44]];
  pts.forEach(function(p){
    CX.save(); CX.translate(p[0],p[1]); CX.scale(1,0.30);
    var g=CX.createRadialGradient(0,0,3,0,0,p[2]);
    g.addColorStop(0,'rgba(96,120,88,0.55)'); g.addColorStop(.5,'rgba(70,92,72,0.26)');
    g.addColorStop(1,'rgba(70,92,72,0)');
    CX.fillStyle=g; CX.beginPath(); CX.arc(0,0,p[2],0,6.2832); CX.fill(); CX.restore();
  });
}
function contacts(){
  [[474,901,30],[488,873,25]].forEach(function(p){
    CX.save(); CX.translate(p[0],p[1]); CX.scale(1,0.34);
    var g=CX.createRadialGradient(0,0,1,0,0,p[2]);
    g.addColorStop(0,'rgba(4,8,14,0.96)'); g.addColorStop(.45,'rgba(4,8,14,0.52)');
    g.addColorStop(1,'rgba(4,8,14,0)');
    CX.fillStyle=g; CX.beginPath(); CX.arc(0,0,p[2],0,6.2832); CX.fill(); CX.restore();
  });
}

/* ---- the marker row, GPU PBR, composited over the 2D ground ---- */
async function glRow(){
  const THREE=await import(A+'/js/three.module.min.js');
  const {init}=await import(A+'/js/akthree.js');
  const AKT=init(THREE);
  if(!AKT.webglOK()) return null;
  const gl=document.createElement('canvas'); gl.width=2160; gl.height=2700;
  const R=AKT.setup(gl,{w:1080,h:1350,fov:34,exposure:1.15});
  R.renderer.setClearAlpha(0);
  AKT.environment(R,{intensity:0.55});
  AKT.rig(R,{ key:{color:0xF0C089,i:4.2,pos:[SUNX*18,SUNY*18,-SUNZ*18],radius:6,shadowSize:4},
              rim:{color:0xA9BECB,i:0.75,pos:[-4,3,6]},
              fill:{color:0x3B4A5E,i:0.55,pos:[-2,4,7]},
              ambient:{color:0x2A3038,i:1.2} });
  AKT.frame(R,{fov:34,from:[0,CAMH,0],look:[0,CAMH-ZR*Math.tan(5.3*Math.PI/180),-ZR]});
  const steel=AKT.mat.steel({roughness:0.34,metalness:0.62,color:0xBCC6CC});
  const gold = new THREE.MeshStandardMaterial({color:0xFFC72C,metalness:0.30,roughness:0.42,
                                               emissive:0xFFC72C,emissiveIntensity:0.55});
  const grp=new THREE.Group();
  function marker(X,Z,isGold){
    const g=new THREE.Group();
    const rod=new THREE.Mesh(new THREE.CylinderGeometry(ROD/2,ROD/2,MH,10),steel);
    rod.position.set(X,MH/2,-Z); g.add(rod);
    const tw=0.033, th=0.037;
    const tag=new THREE.Mesh(new THREE.BoxGeometry(tw,th,0.004), isGold?gold:steel);
    tag.position.set(X,MH-th/2+0.003,-Z+0.010); g.add(tag);
    return g;
  }
  STATE.forEach(function(x,i){ grp.add(marker(WX(x,ZR),ZR,i===12)); });
  FED.forEach(function(x){ grp.add(marker(WX(x,ZR),ZR,false)); });
  grp.add(marker(TWIN_X,TWIN_Z,true));
  AKT.add(R,grp,{cast:false,receive:false});
  AKT.objectHero(R,grp,{toward:[SUNX,SUNY,-SUNZ],keyColor:'#F0C089',intensity:1.45});
  R.renderer.render(R.scene,R.camera);
  const snap=await AKT.snapshot(R,{litFloor:0.06,litMin:120});
  if(!snap||!snap.ok) return null;
  return gl;
}

/* ---- the designed Canvas fallback, same composition, same count ---- */
function canvasRow(){
  function marker(x,Z,isGold,alpha){
    var top=TY(Z,MH), base=GY(Z), w=F*ROD/Z;
    var g=CX.createLinearGradient(x-w/2,0,x+w/2,0);
    g.addColorStop(0,'rgba(32,49,58,'+alpha+')');
    g.addColorStop(.62,AKC.mixOklab(FAR,STL,0.42));
    g.addColorStop(1,SPC);                                   // far edge rim, contre-jour
    CX.fillStyle=g; CX.fillRect(x-w/2,top,w,base-top);
    var tw=F*0.033/Z, th=F*0.037/Z;
    CX.fillStyle=isGold?GOLD:AKC.mixOklab(FAR,STL,0.55);
    CX.fillRect(x-tw/2,top,tw,th);
    CX.strokeStyle=isGold?'#FFE08A':SPC; CX.lineWidth=1.1;
    CX.beginPath(); CX.moveTo(x+tw/2,top); CX.lineTo(x+tw/2,top+th); CX.stroke();
  }
  STATE.forEach(function(x,i){ marker(x,ZR,i===12,'0.95'); });
  FED.forEach(function(x){ marker(x,ZR,false,'0.95'); });
  marker(SX(TWIN_X,TWIN_Z),TWIN_Z,true,'0.86');
}

/* EVERY TAG GETS ITS FAR EDGE. Behind the left twelve stations the haze is
   lighter and their tags silhouette cleanly, while the thirteen to the right of
   the gold sat dark on dark and collapsed to a three pixel top rim, so half the
   row read as bare wire on a slide whose legend says ONE MARKER PER ITEM. This
   runs after the row composites, so it works on the GPU path and the raster
   fallback alike. */
function tagRims(){
  function rim(x,Z,warm){
    var top=TY(Z,MH), tw=F*0.033/Z, th=F*0.037/Z;
    CX.fillStyle=warm?'rgba(255,224,138,0.92)':'rgba(215,226,232,0.82)';
    CX.fillRect(x+tw/2-2,top,2,th);
    CX.fillStyle=warm?'rgba(255,232,168,0.55)':'rgba(190,204,214,0.42)';
    CX.fillRect(x-tw/2,top,tw,1.4);
  }
  STATE.forEach(function(x,i){ rim(x,ZR,i===12); });
  FED.forEach(function(x){ rim(x,ZR,false); });
  rim(SX(TWIN_X,TWIN_Z),TWIN_Z,true);
}

/* ---- one leader, world coordinates, ending on the twin's own cap ---- */
function leader(){
  var at=[SX(TWIN_X,TWIN_Z), TY(TWIN_Z,MH)];
  CX.strokeStyle=FMN; CX.lineWidth=1.25; CX.lineCap='butt';
  CX.beginPath(); CX.moveTo(566,556); CX.lineTo(524,556); CX.lineTo(at[0],at[1]); CX.stroke();
  CX.fillStyle=FMN; CX.beginPath(); CX.arc(at[0],at[1],2.2,0,6.2832); CX.fill();
  window.__akLeaders=[{target:"the twin marker's cap at station 13",
    at:at, to:at, from:[566,556], label:"TWO MARKERS, ONE STATION"}];
}


/* NEAR-GROUND CROWNS. The bottom band is a modelled ground, not a quiet zone,
   and the frame-balance gate is right to ask for craft there. These are the
   near tussock, large and low contrast, drawn in the margins and between the
   type lines, at a value separation small enough that the display type keeps
   its whole contrast range and big enough that the ground reads as ground. */
function nearCrowns(){
  for(var k=0;k<26;k++){
    var r=AK.rng(41337+k);
    /* the crowns model the near lip of the field and stop above the display
       block, because this slide's own standard says nothing is generated below
       y 940 except the graded field, the fog, the grain and one hairline. */
    var y=1000+r()*140, x=-60+r()*1200;
    var w=110+210*r(), h=w*(0.10+0.09*r());
    var a=0.075+0.085*r();
    var cg=CX.createLinearGradient(x,y-h,x,y+h);
    cg.addColorStop(0,'rgba(126,146,158,'+(a*0.9).toFixed(3)+')');
    cg.addColorStop(.55,'rgba(52,66,78,'+(a*0.5).toFixed(3)+')');
    cg.addColorStop(1,'rgba(4,9,15,'+(a*1.1).toFixed(3)+')');
    CX.fillStyle=cg;
    CX.beginPath(); CX.ellipse(x,y,w*0.5,h,0,0,6.2832); CX.fill();
  }
}

window.renderReady=(async function(){
  await document.fonts.ready;
  AK.fitText(document.getElementById('h1'),{min:96,max:136,maxLines:2});

  sky(); farStand(); ground(); bloom(); skyDither(); tussock();
  litPools();
  shadowField();
  contacts();
  fogPools();

  var gl=null;
  try{ gl=await glRow(); }catch(e){ gl=null; }
  if(gl){ CX.drawImage(gl,0,0,2160,2700,0,0,1080,1350); }
  else  { canvasRow(); }

  tagRims();
  nearCrowns();
  leader();

  /* the deck's counted population. The FRAME does the counting, not the loop. */
  var pts=[];
